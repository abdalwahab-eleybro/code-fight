<script>
/* ═══════════════════════════════════════════════════════════ */
/*  13-visualizer.js — Step-through visualizer                 */
/*  · CF.Narrator  — speechSynthesis narration (modality)      */
/*  · CF.Sonify    — algorithm sonification (Web Audio)        */
/*  · CF.Visualizer— code+array sync player with predict stops */
/*  Depends on: 01-state.js                                     */
/* ═══════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

/* ─────────────────────────────────────────────────────────── */
/*  NARRATOR — narration goes in the AUDIO channel,            */
/*  screen shows only short labels (redundancy principle)     */
/* ─────────────────────────────────────────────────────────── */
CF.Narrator = (() => {
  let enabled = true;
  let rate = 1.0;          // 0.5 … 2, follows player speed
  let voice = null;
  let voicePicked = false;
  let curUtter = null;     // live utterance, so the player can wait for it
  let speakAt = 0;          // when the current utterance was queued
  let started = false;      // did the engine actually BEGIN playing it?

  function supported() {
    return typeof window !== 'undefined' && 'speechSynthesis' in window;
  }

  function pickVoice() {
    if (!supported() || voicePicked) return voice;
    voicePicked = true;
    try {
      const vs = window.speechSynthesis.getVoices();
      voice = vs.find(v => /^en(-|_)/i.test(v.lang) && /google|natural|samantha|daniel/i.test(v.name))
           || vs.find(v => /^en(-|_)/i.test(v.lang))
           || vs[0] || null;
    } catch (e) { voice = null; }
    return voice;
  }

  function speak(text) {
    if (!enabled || !supported() || !text) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = Math.max(0.6, Math.min(1.6, 0.95 * rate));
      u.pitch = 1;
      u.volume = 1;
      const v = pickVoice();
      if (v) { try { u.voice = v; } catch (e) {} }
      started = false;
      speakAt = Date.now();
      u.onstart = () => { started = true; };
      u.onend = () => { curUtter = null; };
      u.onerror = () => { curUtter = null; };
      curUtter = u;
      window.speechSynthesis.speak(u);
    } catch (e) { curUtter = null; /* non-fatal */ }
  }

  /* true while the current utterance is still talking.
     Wedge-proof: in sandboxed preview frames speechSynthesis can accept an
     utterance but never start it (onstart/onend never fire, `speaking`
     hangs true). Without the guards below, every player transition would
     wait on a voice that will never play and the run looks frozen. */
  function isSpeaking() {
    if (!enabled || !supported() || !curUtter) return false;
    try {
      const age = Date.now() - speakAt;
      /* queued but the engine never began playing it → stop waiting */
      if (!started && age > 1000) return false;
      /* engine claims to be talking far beyond any plausible duration → wedged */
      if (age > estimateMs(curUtter.text, rate) + 4000) return false;
      return !!(window.speechSynthesis.speaking || window.speechSynthesis.pending);
    } catch (e) { return false; }
  }

  /* Rough spoken-duration estimate (~380 ms/word + punctuation pauses).
     Used to pace playback even where speechSynthesis is missing and
     isSpeaking() is always false (then it doubles as reading time). */
  function estimateMs(text, r) {
    const t = String(text || '').trim();
    if (!t) return 0;
    const words = t.split(/\s+/).length;
    const commas = (t.match(/[,;:—–]/g) || []).length;
    const stops = (t.match(/[.!?]/g) || []).length;
    let ms = words * 380 + commas * 140 + stops * 200;
    ms = Math.round(ms / Math.max(0.6, Math.min(2, r || 1)));
    return Math.min(ms, 15000); /* never stall a step beyond 15 s */
  }

  function stop() {
    if (!supported()) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  return {
    speak, stop,
    supported,
    isSpeaking,
    estimateMs,
    isEnabled: () => enabled,
    setEnabled: (v) => { enabled = !!v; if (!enabled) stop(); },
    setRate: (r) => { rate = r; },
    getRate: () => rate
  };
})();

/* ─────────────────────────────────────────────────────────── */
/*  SONIFY — algorithm sonification. Experimental aid, always  */
/*  optional & separately mutable from narration.              */
/*  Mapping: array value → pitch · index → stereo pan         */
/* ─────────────────────────────────────────────────────────── */
CF.Sonify = (() => {
  let ctx = null;
  let enabled = true;

  function ac() {
    if (!enabled) return null;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }

  function vol() {
    try { return (CF.State?.profile?.settings?.sfxVolume ?? 0.7); }
    catch (e) { return 0.7; }
  }

  function tone(freq, dur, opts = {}) {
    const c = ac(); if (!c || !freq) return;
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (opts.glideTo) {
      try { o.frequency.exponentialRampToValueAtTime(Math.max(opts.glideTo, 1), t + dur); } catch (e) {}
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(opts.vol ?? 0.12, 0.001), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    let node = o;
    if (opts.pan !== undefined && c.createStereoPanner) {
      const p = c.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, opts.pan));
      o.connect(p); node = p;
    }
    node.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, v, freq, q) {
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq || 2000; f.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
  }

  /* Map an array value to a pitch in a pentatonic-ish band 220–880 Hz */
  function valueFreq(v, lo, hi) {
    if (typeof v !== 'number') return 440;
    const span = (hi - lo) || 1;
    const frac = Math.max(0, Math.min(1, (v - lo) / span));
    return 220 * Math.pow(2, frac * 2);   // two octaves
  }

  /* pan: index 0..n-1 → -0.8..0.8 */
  function idxPan(i, n) {
    if (!n) return 0;
    return -0.8 + (1.6 * i) / Math.max(1, n - 1);
  }

  /**
   * Play a sonification event.
   * ev: { type, arr, indices, value, valueLo, valueHi }
   * types: init compare move swap write found grow shrink build buzz win
   */
  function fx(type, ev = {}) {
    if (!enabled) return;
    const v = vol();
    if (v === 0) return;
    const arr = ev.arr || [];
    const lo = ev.valueLo, hi = ev.valueHi;
    const fOf = (i) => (i >= 0 && i < arr.length)
      ? valueFreq(typeof arr[i] === 'number' ? arr[i] : lo, lo, hi) : 440;

    switch (type) {
      case 'init':
        tone(330, 0.14, { type: 'triangle', vol: 0.10 * v });
        break;
      case 'compare': {
        const [a, b] = ev.indices || [0, 0];
        tone(fOf(a), 0.10, { type: 'sine', vol: 0.12 * v, pan: idxPan(a, arr.length) });
        setTimeout(() => tone(fOf(b), 0.10, { type: 'sine', vol: 0.12 * v, pan: idxPan(b, arr.length) }), 110);
        break;
      }
      case 'move': {
        const i = ev.indices?.[0] ?? 0;
        const f = fOf(i);
        tone(f * 1.5, 0.12, { type: 'triangle', vol: 0.12 * v, glideTo: f, pan: idxPan(i, arr.length) });
        break;
      }
      case 'swap': {
        const [a, b] = ev.indices || [0, 0];
        const fa = fOf(a), fb = fOf(b);
        tone(fa, 0.18, { type: 'triangle', vol: 0.12 * v, glideTo: fb, pan: idxPan(a, arr.length) });
        setTimeout(() => tone(fb, 0.18, { type: 'triangle', vol: 0.12 * v, glideTo: fa, pan: idxPan(b, arr.length) }), 60);
        noise(0.08, 0.10 * v, 2600, 1.2);
        break;
      }
      case 'write':
        tone(520, 0.06, { type: 'square', vol: 0.08 * v, pan: idxPan(ev.indices?.[0] ?? 0, arr.length) });
        noise(0.05, 0.06 * v, 3200, 1.5);
        break;
      case 'grow':
        tone(330, 0.16, { type: 'sine', vol: 0.11 * v, glideTo: 560 });
        break;
      case 'shrink':
        tone(560, 0.16, { type: 'sine', vol: 0.11 * v, glideTo: 300 });
        break;
      case 'build':
        tone(valueFreq(ev.value ?? 1, lo, hi), 0.14, { type: 'triangle', vol: 0.12 * v });
        break;
      case 'found':
        [523, 659, 784].forEach((f, i) =>
          setTimeout(() => tone(f, 0.28, { type: 'triangle', vol: 0.13 * v }), i * 90));
        break;
      case 'win':
        tone(660, 0.2, { type: 'triangle', vol: 0.12 * v });
        tone(990, 0.3, { type: 'sine', vol: 0.08 * v });
        break;
      case 'buzz':
        tone(180, 0.16, { type: 'sawtooth', vol: 0.09 * v, glideTo: 120 });
        break;
    }
  }

  return {
    fx,
    unlock: () => { ac(); },
    isEnabled: () => enabled,
    setEnabled: (v) => { enabled = !!v; },
    _ac: () => ctx
  };
})();

/* ─────────────────────────────────────────────────────────── */
/*  VISUALIZER — the reusable step-through engine              */
/*                                                              */
/*  trace = {                                                   */
/*    code:  ['line 0', 'line 1', ...],                         */
/*    steps: [                                                  */
/*      { line: 2, caption: 'short label', narration: '…',      */
/*        state: { arr, ptrs:{L:0,R:3}, marks:{},               */
/*                 aux:[{label,value}], row2:{...} },           */
/*        fx: { type:'compare', indices:[0,3] },                */
/*        predict: { q, options:[], correct:0, why:'…' },      */
/*        drive:  { prompt, options:[], correct:0,              */
/*                  why:'…', hint:'…' } }                      */
/*    ]                                                         */
/*  }                                                           */
/* ─────────────────────────────────────────────────────────── */
CF.Visualizer = (() => {
  const PREF_KEY = 'cf_viz_prefs';
  const BASE_STEP_MS = 1500;

  function loadPrefs() {
    const defaults = { narration: true, sonify: true, captions: true, speed: 1 };
    try {
      const raw = localStorage.getItem(PREF_KEY);
      if (!raw) return defaults;
      return Object.assign(defaults, JSON.parse(raw));
    } catch (e) { return defaults; }
  }
  function savePrefs(p) {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch (e) {}
  }
  let prefs = loadPrefs();

  const PTR_COLORS = { L: 'var(--player)', R: 'var(--enemy)', i: '#a78bfa', l: '#fbbf24', 'r+1': '#fb923c', out: '#94a3b8' };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ── SCENE RENDER (shared by watch / drive modes) ── */
  function renderScene(stage, state) {
    if (!state) return;
    stage.innerHTML = '';

    /* main array row */
    const main = document.createElement('div');
    main.className = 'vz-row';
    stage.appendChild(main);

    const arr = state.arr || [];
    const nums = arr.filter(x => typeof x === 'number');
    const lo = Math.min.apply(null, nums.length ? nums : [0]);
    const hi = Math.max.apply(null, nums.length ? nums : [1]);

    arr.forEach((v, i) => {
      const cell = document.createElement('div');
      const mk = state.marks?.[i] || state.marks?.[String(i)] || '';
      cell.className = 'vz-cell ' + (mk || '');
      cell.dataset.i = i;
      if (typeof v === 'number') {
        const frac = hi > lo ? (v - lo) / (hi - lo) : 0.6;
        cell.style.setProperty('--h', (32 + Math.round(frac * 58)) + '%');
      } else {
        cell.style.setProperty('--h', '48%');
      }
      cell.innerHTML = `<span class="vz-val">${esc(v)}</span>`;
      main.appendChild(cell);
    });

    /* pointer layer under main row */
    const ptrLayer = document.createElement('div');
    ptrLayer.className = 'vz-ptrs';
    stage.appendChild(ptrLayer);
    positionPointers(ptrLayer, main, state.ptrs || {}, arr.length);

    /* aux chips (sum, target, best…) */
    if (state.aux && state.aux.length) {
      const aux = document.createElement('div');
      aux.className = 'vz-aux';
      state.aux.forEach(a => {
        const chip = document.createElement('span');
        chip.className = 'vz-aux-chip';
        chip.innerHTML = `<b>${esc(a.label)}</b> ${esc(a.value)}`;
        aux.appendChild(chip);
      });
      stage.appendChild(aux);
    }

    /* second row (prefix arrays / output rows) */
    if (state.row2) {
      const r2wrap = document.createElement('div');
      r2wrap.className = 'vz-row2-wrap';
      const lbl = document.createElement('div');
      lbl.className = 'vz-row2-label';
      lbl.textContent = state.row2.label || '';
      r2wrap.appendChild(lbl);

      const row = document.createElement('div');
      row.className = 'vz-row small';
      (state.row2.arr || []).forEach((v, i) => {
        const cell = document.createElement('div');
        const mk = state.row2.marks?.[i] || state.row2.marks?.[String(i)] || '';
        cell.className = 'vz-cell ' + (mk || '');
        cell.dataset.i = i;
        if (typeof v === 'number') {
          const frac = hi > lo ? (v - lo) / (hi - lo) : 0.5;
          cell.style.setProperty('--h', (24 + Math.round(frac * 40)) + '%');
        } else { cell.style.setProperty('--h', '36%'); }
        cell.innerHTML = `<span class="vz-val">${esc(v)}</span>`;
        row.appendChild(cell);
      });
      r2wrap.appendChild(row);
      stage.appendChild(r2wrap);

      if (state.row2.ptrs && Object.keys(state.row2.ptrs).length) {
        const p2 = document.createElement('div');
        p2.className = 'vz-ptrs';
        stage.appendChild(p2);
        positionPointers(p2, row, state.row2.ptrs, (state.row2.arr || []).length);
      }
    }
  }

  function positionPointers(layer, row, ptrs, n) {
    Object.keys(ptrs).forEach(id => {
      const i = ptrs[id];
      let el = layer.querySelector(`[data-ptr="${id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'vz-ptr';
        el.dataset.ptr = id;
        el.innerHTML = `<span class="vz-ptr-tag">${esc(id)}</span><span class="vz-ptr-arrow">▲</span>`;
        layer.appendChild(el);
      }
      const cells = row.querySelectorAll('.vz-cell');
      const cell = cells[Math.max(0, Math.min(i, cells.length - 1))];
      if (cell) {
        /* rect-based positioning: correct no matter which ancestor is the
           offsetParent (the idea-phase mini stage is not position:relative
           the way the player stage is, so offsetLeft measured from the
           wrong origin and every pointer shifted right) */
        const lr = layer.getBoundingClientRect();
        const cr = cell.getBoundingClientRect();
        if (i > cells.length - 1) {
          /* pointer past the last cell (e.g. 'r+1' at the exclusive right
             edge): hover it just beyond the row instead of clamping it onto
             the last cell, which is a different index */
          el.style.left = (cr.right - lr.left + 4) + 'px';
        } else {
          el.style.left = (cr.left - lr.left + cr.width / 2) + 'px';
        }
      }
      const col = PTR_COLORS[id] || 'var(--player)';
      el.style.color = col;              /* arrow + fallbacks */
      el.style.setProperty('--ptr-col', col); /* name chip background */
    });
  }

  /* ── PLAYER ── */
  function createPlayer(opts) {
    const { container, trace, mode = 'watch', onDone, onProgress } = opts;
    const steps = trace.steps || [];
    let idx = 0;
    let playing = mode === 'drive';
    let timer = null;
    const stats = { predicts: { right: 0, total: 0 }, driveMistakes: 0 };
    let destroyed = false;
    let doneFired = false;

    function fireDone() {
      if (doneFired || destroyed) return;
      doneFired = true;
      pause();
      CF.Sonify.fx('win', {});
      if (onDone) onDone({ ...stats });
    }

    /* Build DOM */
    container.innerHTML = `
      <div class="vz">
        <div class="vz-head">
          <span class="vz-phase">${mode === 'drive' ? '🎮 Drive it' : '👀 Watch'}</span>
          <span class="vz-progress" id="vzProg"></span>
          <span class="vz-toggles">
            <button class="vz-toggle" data-t="narration" title="Narration">🔊</button>
            <button class="vz-toggle" data-t="sonify" title="Sonification">🎵</button>
            <button class="vz-toggle" data-t="captions" title="Captions">💬</button>
          </span>
        </div>
        <div class="vz-stage" id="vzStage"></div>
        <div class="vz-caption" id="vzCap"></div>
        <div class="vz-codeline" id="vzCode"></div>
        <div class="vz-transport" id="vzTransport"></div>
        <div class="vz-overlay" id="vzOverlay" style="display:none"></div>
        <div class="vz-drive" id="vzDrive" style="display:none"></div>
      </div>`;

    const el = (id) => container.querySelector('#' + id);
    const stage = el('vzStage'), cap = el('vzCap'), codeEl = el('vzCode');
    const transport = el('vzTransport'), overlay = el('vzOverlay'), driveEl = el('vzDrive');

    /* code panel */
    (trace.code || []).forEach((line, i) => {
      const l = document.createElement('div');
      l.className = 'vz-code-line';
      l.dataset.line = i;
      l.textContent = line;
      codeEl.appendChild(l);
    });

    /* toggles */
    container.querySelectorAll('.vz-toggle').forEach(btn => {
      const t = btn.dataset.t;
      const paint = () => { btn.classList.toggle('off', !prefs[t]); };
      paint();
      btn.addEventListener('click', () => {
        prefs[t] = !prefs[t];
        savePrefs(prefs);
        paint();
        if (t === 'narration' && !prefs.narration) CF.Narrator.stop();
        if (t === 'sonify') CF.Sonify.setEnabled(prefs.sonify);
      });
    });
    CF.Narrator.setEnabled(prefs.narration);
    CF.Sonify.setEnabled(prefs.sonify);

    /* transport */
    function transportBtn(label, fn, title) {
      const b = document.createElement('button');
      b.className = 'vz-btn';
      b.textContent = label;
      b.title = title || '';
      b.addEventListener('click', fn);
      transport.appendChild(b);
      return b;
    }
    let playBtn = null;
    if (mode === 'watch') {
      transportBtn('⏮', () => { goTo(0); }, 'Restart');
      transportBtn('◀', () => { goTo(Math.max(0, idx - 1)); }, 'Back one step');
      playBtn = transportBtn('▶', () => { togglePlay(); }, 'Play / pause');
      transportBtn('▶|', () => { stepForward(); }, 'Forward one step');
      const speedSel = document.createElement('select');
      speedSel.className = 'vz-speed';
      [0.75, 1, 1.5, 2].forEach(s => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s + '×';
        if (s === prefs.speed) o.selected = true;
        speedSel.appendChild(o);
      });
      speedSel.addEventListener('change', () => { prefs.speed = Number(speedSel.value); savePrefs(prefs); });
      transport.appendChild(speedSel);
    } else {
      transportBtn('⏮', () => { goTo(0); }, 'Restart');
      /* manual step-forward: in drive mode the learner waits on timers
         between prompts — this guarantees forward control even if the
         auto-advance chain ever dies (a step with an open prompt is
         still protected: stepForward refuses to skip it) */
      transportBtn('▶|', () => { clearTimer(); stepForward(); }, 'Forward one step');
    }

    /* ── stepping ── */
    function stepMs() { return BASE_STEP_MS / (prefs.speed || 1); }

    /* Pacing: a step must not advance while the narrator is still
       talking. Base delay = max(1.5 s, estimated spoken duration). */
    function stepWaitMs() {
      const s = steps[idx];
      const base = stepMs();
      if (!s) return base;
      const text = s.narration || s.caption || '';
      if (prefs.narration && text) {
        const est = CF.Narrator.estimateMs(text, prefs.speed || 1) + 350;
        /* drive mode is interaction-first: the learner is here to make
           moves — never let a long narration estimate stall the pace */
        if (mode === 'drive') return Math.min(Math.max(base, est), 6000);
        return Math.max(base, est);
      }
      return base;
    }

    function renderStep() {
      const s = steps[idx];
      if (!s) return;
      renderScene(stage, s.state);
      container.querySelector('.vz-progress').textContent = `${idx + 1} / ${steps.length}`;
      codeEl.querySelectorAll('.vz-code-line').forEach(l =>
        l.classList.toggle('active', Number(l.dataset.line) === (s.line ?? -1)));
      cap.textContent = s.caption || '';
      cap.className = 'vz-caption' + (prefs.captions && s.narration ? ' full' : '');
      if (prefs.captions && s.narration) cap.textContent = s.narration;
      if (s.fx && s.fx.type) {
        const arr = s.state?.arr || [];
        const numsA = arr.filter(x => typeof x === 'number');
        CF.Sonify.fx(s.fx.type, {
          ...s.fx,
          arr,
          valueLo: numsA.length ? Math.min.apply(null, numsA) : 0,
          valueHi: numsA.length ? Math.max.apply(null, numsA) : 1
        });
      }
      CF.Narrator.setRate(prefs.speed || 1);
      CF.Narrator.speak(s.narration || s.caption || '');
      if (onProgress) onProgress(idx, steps.length);
    }

    function goTo(i) {
      pause();
      if (mode === 'drive') playing = true; /* drive has no manual pause — it only waits at prompts */
      idx = Math.max(0, Math.min(i, steps.length - 1));
      renderStep();
      maybeInteract();
    }

    function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }

    /* an open predict/drive prompt must never be skipped by a pending timer */
    function promptOpen() {
      return overlay.style.display !== 'none' || driveEl.style.display !== 'none';
    }

    function stepForward() {
      if (promptOpen()) return;
      if (idx >= steps.length - 1) { finishIfEnd(); return; }
      idx++;
      renderStep();
      maybeInteract();
    }

    function maybeInteract() {
      const s = steps[idx];
      overlay.style.display = 'none';
      driveEl.style.display = 'none';
      if (s.predict && mode === 'watch') { pause(); showPredict(s); return; }
      if (s.drive && mode === 'drive') { pause(); showDrive(s); return; }
      if (playing) { autoAdvance(); } /* keep the playback chain alive in BOTH modes */
    }

    function autoAdvance() {
      clearTimer();
      let held = 0;
      const tick = () => {
        if (destroyed || !playing) return;
        /* narrator still mid-sentence → hold the step, recheck every
           250 ms (cap ≈ +12 s so a stuck voice engine can't freeze it) */
        if (CF.Narrator.isSpeaking() && held < 48) {
          held++;
          timer = setTimeout(tick, 250);
          return;
        }
        stepForward();
      };
      timer = setTimeout(tick, stepWaitMs());
    }

    function togglePlay() {
      if (playing) { pause(); }
      else {
        if (promptOpen()) return; /* don't auto-skip an open prompt */
        playing = true; autoAdvance();
      }
      if (playBtn) playBtn.textContent = playing ? '⏸' : '▶';
    }
    function pause() {
      playing = false;
      clearTimer();
      if (playBtn) playBtn.textContent = '▶';
    }

    function finishIfEnd() {
      if (idx >= steps.length - 1) {
        fireDone();
      }
    }

    /* ── predict overlay (watch mode) ── */
    function showPredict(s) {
      stats.predicts.total++;
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div class="vz-pop">
          <div class="vz-pop-q">🤔 ${esc(s.predict.q)}</div>
          <div class="vz-pop-opts"></div>
          <div class="vz-pop-why" style="display:none"></div>
        </div>`;
      const optsBox = overlay.querySelector('.vz-pop-opts');
      const whyBox = overlay.querySelector('.vz-pop-why');
      let answered = false;
      s.predict.options.forEach((opt, i) => {
        const b = document.createElement('button');
        b.className = 'vz-opt';
        b.textContent = opt;
        b.addEventListener('click', () => {
          if (answered) return;
          answered = true;
          const right = i === s.predict.correct;
          if (right) { stats.predicts.right++; CF.Sonify.fx('win', {}); }
          else { CF.Sonify.fx('buzz', {}); }
          b.classList.add(right ? 'right' : 'wrong');
          overlay.querySelectorAll('.vz-opt').forEach((o, j) => {
            if (j === s.predict.correct) o.classList.add('right');
            o.disabled = true;
          });
          whyBox.style.display = 'block';
          whyBox.innerHTML = `${right ? '✅' : '❌'} ${esc(s.predict.why)}<br>
            <button class="vz-opt continue">Continue ▶</button>`;
          whyBox.querySelector('.continue').addEventListener('click', () => {
            overlay.style.display = 'none';
            playing = true;
            if (playBtn) playBtn.textContent = '⏸';
            autoAdvance();
          });
        });
        optsBox.appendChild(b);
      });
    }

    /* ── drive bar (drive mode) ── */
    function showDrive(s) {
      driveEl.style.display = 'block';
      driveEl.innerHTML = `
        <div class="vz-drive-q">${esc(s.drive.prompt)}</div>
        <div class="vz-drive-opts"></div>
        <div class="vz-drive-fb"></div>`;
      const optsBox = driveEl.querySelector('.vz-drive-opts');
      const fb = driveEl.querySelector('.vz-drive-fb');
      let answered = false;
      s.drive.options.forEach((opt, i) => {
        const b = document.createElement('button');
        b.className = 'vz-opt';
        b.textContent = opt;
        b.addEventListener('click', () => {
          if (answered) return;
          if (i === s.drive.correct) {
            answered = true;
            CF.Sonify.fx('win', {});
            optsBox.querySelectorAll('.vz-opt').forEach(o => o.disabled = true);
            b.classList.add('right');
            fb.textContent = '✅ ' + (s.drive.why || '');
            fb.className = 'vz-drive-fb ok';
            /* Manual Continue: the run can never be stranded — a stalled
               timer, a wedged voice engine, or an impatient learner all
               reach the next step through this button (mirrors the
               predict overlay). The auto-advance fires first, capped at
               5 s so the screen never sits still for long. */
            let advanced = false;
            const advance = () => {
              if (advanced) return;
              advanced = true;
              clearTimer();
              driveEl.style.display = 'none';
              playing = true;
              autoAdvance();
            };
            const cont = document.createElement('button');
            cont.className = 'vz-opt continue';
            cont.textContent = 'Continue ▶';
            cont.addEventListener('click', (e) => { e.stopPropagation(); advance(); });
            fb.appendChild(document.createElement('br'));
            fb.appendChild(cont);
            timer = setTimeout(advance,
              Math.max(1200, Math.min(CF.Narrator.estimateMs(s.drive.why || '', 1) + 300, 5000)));
          } else {
            stats.driveMistakes++;
            CF.Sonify.fx('buzz', {});
            b.classList.add('wrong');
            fb.textContent = '❌ ' + (s.drive.hint || 'Not quite — check the sum and think again.');
            fb.className = 'vz-drive-fb bad';
            setTimeout(() => b.classList.remove('wrong'), 600);
          }
        });
        optsBox.appendChild(b);
      });
    }

    /* finish detection: fire onDone once the last step has been shown */
    const origRender = renderStep;
    renderStep = function () {
      origRender();
      if (idx >= steps.length - 1 && !steps[idx].drive && !steps[idx].predict) {
        /* let the last visual breathe AND let the narrator finish his
           closing line, then signal completion */
        clearTimer();
        const s = steps[idx];
        const text = s.narration || s.caption || '';
        const wait = (prefs.narration && text)
          ? Math.max(stepMs() * 0.8, CF.Narrator.estimateMs(text, prefs.speed || 1) + 400)
          : stepMs() * 0.8;
        const held = 0;
        const tick = () => {
          if (destroyed) return;
          if (CF.Narrator.isSpeaking() && held < 48) { held++; timer = setTimeout(tick, 250); return; }
          fireDone();
        };
        timer = setTimeout(tick, mode === 'drive' ? Math.min(wait, 5000) : wait);
      }
    };

    function destroy() {
      destroyed = true;
      clearTimer();
      pause();
      CF.Narrator.stop();
    }

    /* init */
    renderStep();
    maybeInteract(); /* engage: drive mode starts advancing / opens the first prompt */

    return { destroy, goTo, stepForward, play: () => { if (!playing) togglePlay(); } };
  }

  return { createPlayer, renderScene };
})();







</script>
<script>
/* ═══════════════════════════════════════════════════════════ */
/*  15-aitutor.js — Gemini-powered AI tutor                    */
/*  · Socratic hints (never reveals the answer)               */
/*  · Explain-back grading with strict rubric                 */
/*  · Misconception diagnosis from weak spots                  */
/*                                                              */
/*  The API key lives ONLY in this browser (localStorage, with an  */
/*  in-memory fallback for sandboxed previews where localStorage   */
/*  is blocked), separate from the game profile so exports never  */
/*  leak it. Latest Gemini models at time of build: 3.x series.   */
/*  Depends on: 01-state.js                                      */
/* ═════════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

CF.AITutor = (() => {
  const KEY_STORAGE = 'cf_gemini_api_key';
  const MODEL_STORAGE = 'cf_gemini_model';

  /* Gemini 3.x series — current model lineup (Oct 2026). */
  const MODELS = [
    { id: 'gemini-3.8-flash', label: 'Gemini 3.8 Flash (latest, recommended)' },
    { id: 'gemini-3.6-flash', label: 'Gemini 3.6 Flash (stable)' },
    { id: 'gemini-3.1-pro-preview', label: 'Gemini 3.1 Pro Preview (strongest)' },
    { id: 'gemini-3.5-flash-lite', label: 'Gemini 3.5 Flash-Lite (fastest/cheapest)' }
  ];

  /* in-memory fallback — some sandboxes/iframes block localStorage */
  let memKey = '', memModel = '';

  function canPersist() {
    try {
      localStorage.setItem('__cf_probe', '1');
      localStorage.removeItem('__cf_probe');
      return true;
    } catch (e) { return false; }
  }
  function getKey() {
    let v = '';
    try { v = localStorage.getItem(KEY_STORAGE) || ''; } catch (e) {}
    return (v || memKey).trim();
  }
  function setKey(k) {
    memKey = String(k || '').trim();
    try { localStorage.setItem(KEY_STORAGE, memKey); } catch (e) {}
  }
  function getModel() {
    let m = '';
    try { m = localStorage.getItem(MODEL_STORAGE) || ''; } catch (e) {}
    if (!m || !MODELS.some(x => x.id === m)) m = memModel || MODELS[0].id; // unknown/legacy id → default
    return m;
  }
  function setModel(m) {
    memModel = m;
    try { localStorage.setItem(MODEL_STORAGE, m); } catch (e) {}
  }
  function isConfigured() { return getKey().length > 10; }

  const SYSTEM_PROMPT = [
    'You are a Socratic programming tutor inside "Code Fighter", a game that teaches coding-interview patterns.',
    'Rules: be concise (under 120 words), warm and concrete.',
    'When a learner explains an idea back to you, grade strictly but kindly.',
    'NEVER reveal the full invariant/answer you are given — guide with questions and tiny concrete examples instead.',
    'Reply in plain text only. No markdown headers, no bullet lists unless asked.'
  ].join(' ');

  /* ── core call ── */
  async function generate(userPrompt, opts = {}) {
    const key = getKey();
    if (!key) throw new Error('No API key configured. Add your Gemini key in the AI Tutor card.');
    const model = opts.model || getModel();
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const body = {
      systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
      generationConfig: {
        temperature: opts.temperature ?? 0.4,
        maxOutputTokens: opts.maxTokens ?? 700
      }
    };
    let resp;
    try {
      resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify(body)
      });
    } catch (e) {
      throw new Error('Network blocked or offline. (If you are inside the sandboxed preview, download the file and open it in a browser.)');
    }
    if (!resp.ok) {
      if (resp.status === 400 || resp.status === 403) throw new Error('Request rejected — check your API key.');
      if (resp.status === 404) throw new Error('Model not found — pick another model.');
      if (resp.status === 429) throw new Error('Rate limit reached — wait a moment and retry.');
      throw new Error('Gemini error ' + resp.status);
    }
    const data = await resp.json();
    const parts = data?.candidates?.[0]?.content?.parts;
    const text = Array.isArray(parts) ? parts.map(p => p.text || '').join('').trim() : '';
    if (!text) throw new Error('Empty response from the model.');
    return text;
  }

  /* ── feature: test connection ── */
  async function testConnection() {
    const t = await generate('Reply with exactly: TUTOR ONLINE', { maxTokens: 20, temperature: 0 });
    return t;
  }

  /* ── feature: explain-back grading ──
     Returns { verdict: 'PASS'|'RETRY', feedback } */
  async function gradeExplanation({ title, invariant, question, learnerText }) {
    const prompt = [
      `Lesson: "${title}".`,
      `The learner was asked: "${question}"`,
      `The correct core idea (ground truth — for you only, never quote it back): "${invariant}"`,
      `The learner's explanation: "${learnerText}"`,
      '',
      'Grade strictly against the ground truth: does the explanation capture the key idea in their own words?',
      'First line must be exactly "VERDICT: PASS" or "VERDICT: RETRY".',
      'Then: one sentence naming what they got right.',
      'If RETRY: exactly ONE guiding question or one tiny concrete example that leads them there without revealing the answer.'
    ].join('\n');
    const text = await generate(prompt, { temperature: 0.3 });
    const m = text.match(/VERDICT:\s*(PASS|RETRY)/i);
    const verdict = m ? (m[1].toUpperCase() === 'PASS' ? 'PASS' : 'RETRY') : 'RETRY';
    const feedback = text.replace(/VERDICT:\s*(PASS|RETRY)/i, '').trim() || text;
    return { verdict, feedback };
  }

  /* ── feature: Socratic hint ── */
  async function socraticHint({ title, question, learnerQuestion }) {
    const prompt = [
      `Lesson: "${title}".`,
      `The learner is working on: "${question}"`,
      learnerQuestion ? `They ask: "${learnerQuestion}"` : 'They say they are stuck.',
      'Give ONE guiding question, or ONE tiny concrete example (3–4 numbers max).',
      'Never state the answer. Max 50 words.'
    ].join('\n');
    return generate(prompt, { temperature: 0.6, maxTokens: 250 });
  }

  /* ── feature: misconception diagnosis ── */
  async function diagnose({ patternName, errorSummary, lessonTitles }) {
    const prompt = [
      'You are diagnosing a learner in a pattern-recognition training game.',
      `Pattern: ${patternName}.`,
      `Their recent mistakes: ${errorSummary}`,
      `Available lessons: ${lessonTitles.join(', ')}.`,
      'In under 90 words: (1) name the single most likely underlying misconception,',
      '(2) recommend exactly ONE lesson or drill to fix it. Plain text.'
    ].join('\n');
    return generate(prompt, { temperature: 0.4, maxTokens: 400 });
  }

  return {
    MODELS, getKey, setKey, getModel, setModel, isConfigured, canPersist,
    generate, testConnection, gradeExplanation, socraticHint, diagnose
  };
})();

<script>
/* ═══════════════════════════════════════════════════════════ */
/*  14-lessons.js — Interactive lessons: Hook → Watch →        */
/*  Predict → Drive → Break it → Explain (AI) → Quiz → Reward  */
/*                                                              */
/*  Pedagogy implemented:                                        */
/*   · Dual coding     — code + array view in sync              */
/*   · Modality        — narration in audio, short labels on    */
/*                      screen (no paragraph text walls)         */
/*   · Segmenting      — learner controls every step             */
/*   · Prediction eff. — predict-before-reveal checkpoints       */
/*   · Generation      — Drive mode: you move the pointers       */
/*   · Self-explanation— Explain phase, graded by Gemini        */
/*   · Worked examples — Watch phase is fully worked             */
/*   · Misconceptions  — "Break it" shows a real failing input   */
/*   · Review link     — quiz answers feed CF.Spaced (SM-2-ish)  */
/*  Depends on: 01, 03, 04, 13, 15                               */
/* ═════════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

CF.Lessons = (() => {
  const S = CF.State;
  const Q = CF.Questions;
  const R = CF.Renderers;
  const AI = CF.AITutor;

  /* ═══════════════════════════════════════════════════════ */
  /*  TRACE GENERATORS (pure — testable without a DOM)       */
  /* ═══════════════════════════════════════════════════════ */

  /* ── P1 · Converging pointers (Two Sum II) ── */
  function twoSumTrace(nums, target, mode, opts = {}) {
    const n = nums.length;
    const steps = [];
    /* first predict comes AFTER the learner has seen one full narrated move */
  const preOpts = (opts && Array.isArray(opts.watchPredicts)) ? opts.watchPredicts : [1, 2];

    steps.push({
      line: 0,
      caption: 'L = 0, R = n − 1',
      narration: `The array is sorted, so we start L at the left end and R at the right end, index ${n - 1}. We will converge from both sides.`,
      state: { arr: [...nums], ptrs: { L: 0, R: n - 1 }, marks: {}, aux: [{ label: 'target', value: target }] },
      fx: { type: 'init' }
    });

    let L = 0, Rn = n - 1;
    let decisionCount = 0;

    while (L < Rn) {
      const a = nums[L], b = nums[Rn], s = a + b;

      const cmp = {
        line: 2,
        caption: `sum = ${a} + ${b} = ${s}`,
        narration: `The sum of ${a} and ${b} is ${s}.`,
        state: {
          arr: [...nums], ptrs: { L, R: Rn },
          marks: { [L]: 'cmp', [Rn]: 'cmp' },
          aux: [{ label: 'target', value: target }, { label: 'sum', value: s }]
        },
        fx: { type: 'compare', indices: [L, Rn] }
      };

      if (s === target) {
        if (mode === 'watch') {
          cmp.predict = {
            q: `sum = ${s} and target = ${target}. What happens next?`,
            options: ['return [L+1, R+1]', 'L += 1', 'R -= 1'],
            correct: 0,
            why: `Equal — this is the pair. We return indices ${L + 1} and ${Rn + 1}.`
          };
        }
        steps.push(cmp);
        steps.push({
          line: 4,
          caption: `Found: [${L + 1}, ${Rn + 1}] → ${a} + ${b} = ${target}`,
          narration: `Found it. ${a} plus ${b} equals ${target}. We never scanned the whole array — every step discarded an entire candidate.`,
          state: {
            arr: [...nums], ptrs: { L, R: Rn },
            marks: { [L]: 'win', [Rn]: 'win' },
            aux: [{ label: 'target', value: target }, { label: 'sum', value: s }, { label: 'done', value: '✓', done: true }]
          },
          fx: { type: 'found' }
        });
        break;
      }

      const tooSmall = s < target;

      /* watch mode: prediction checkpoints on the first two decisions */
      if (mode === 'watch' && preOpts.includes(decisionCount)) {
        cmp.predict = {
          q: `sum = ${s} ${tooSmall ? '<' : '>'} ${target}. Which pointer moves next?`,
          options: tooSmall ? ['L += 1', 'R -= 1'] : ['R -= 1', 'L += 1'],
          correct: 0,
          why: tooSmall
            ? `${s} is too small. Keeping R here, no later L (values only grow) can help — nums[L] is the bottleneck, so L moves right.`
            : `${s} is too big. Keeping L here, no earlier R (values only shrink) can help — nums[R] is the bottleneck, so R moves left.`
        };
      }
      if (mode !== 'drive') steps.push(cmp);

      /* drive mode: the decision step */
      if (mode === 'drive') {
        steps.push({
          line: tooSmall ? 5 : 7,
          caption: `${s} ${tooSmall ? '<' : '>'} ${target} — your move`,
          narration: '',
          state: cmp.state,
          fx: { type: 'compare', indices: [L, Rn] },
          drive: {
            prompt: `sum = ${s} ${tooSmall ? '<' : '>'} ${target}. Which pointer moves?`,
            options: ['L += 1', 'R -= 1'],
            correct: tooSmall ? 0 : 1,
            why: tooSmall
              ? `${s} is below the target — the left value is the bottleneck, so L moves right.`
              : `${s} is above the target — the right value is the bottleneck, so R moves left.`,
            hint: `The sum is too ${tooSmall ? 'small' : 'big'}. Which side is responsible for that?`
          }
        });
      }

      /* execute the move */
      const oldR = Rn, oldL = L;
      if (tooSmall) { L++; } else { Rn--; }
      const movedIdx = tooSmall ? L : Rn;
      const marks = { [movedIdx]: 'cmp' };
      if (tooSmall) marks[oldL] = 'out'; else marks[oldR] = 'out';

      steps.push({
        line: tooSmall ? 6 : 8,
        caption: tooSmall ? `L moves to ${L}` : `R moves to ${Rn}`,
        narration: tooSmall
          ? `The left value was the bottleneck. L moves right, and index ${oldL} can never be part of the answer.`
          : `The right value was the bottleneck. R moves left, and index ${oldR} can never be part of the answer.`,
        state: {
          arr: [...nums], ptrs: { L, R: Rn }, marks,
          aux: [{ label: 'target', value: target }, { label: 'sum', value: s }]
        },
        fx: { type: 'move', indices: [movedIdx] }
      });

      decisionCount++;
    }

    return {
      code: [
        'L, R = 0, len(nums) - 1',
        'while L < R:',
        '    s = nums[L] + nums[R]',
        '    if s == target:',
        '        return [L + 1, R + 1]',
        '    elif s < target:',
        '        L += 1',
        '    else:',
        '        R -= 1'
      ],
      steps
    };
  }

  /* ── P1 · Misconception: converging on UNSORTED input ── */
  function twoSumBugTrace(nums, target) {
    const n = nums.length;
    const steps = [];
    steps.push({
      line: 1,
      caption: '⚠️ NOT sorted — the algorithm does not know that',
      narration: `Here is the same code on an array that is not sorted. Watch what the rule does when its secret assumption is violated.`,
      state: { arr: [...nums], ptrs: { L: 0, R: n - 1 }, marks: {}, aux: [{ label: 'target', value: target }] },
      fx: { type: 'init' }
    });
    let L = 0, Rn = n - 1;
    while (L < Rn) {
      const a = nums[L], b = nums[Rn], s = a + b;
      const tooSmall = s < target;
      const cmp = {
        line: 3,
        caption: `sum = ${a} + ${b} = ${s}`,
        narration: `Sum is ${s}. The rule says: too ${tooSmall ? 'small, move L' : 'big, discard the right value'}. But is discarding it actually safe here?`,
        state: {
          arr: [...nums], ptrs: { L, R: Rn },
          marks: { [L]: 'cmp', [Rn]: 'cmp' },
          aux: [{ label: 'target', value: target }, { label: 'sum', value: s }]
        },
        fx: { type: 'compare', indices: [L, Rn] }
      };
      if (Rn === 2) {
        cmp.predict = {
          q: `The rule is about to discard nums[R] = ${nums[Rn]}. Safe?`,
          options: ['No — unsorted data means the discard guarantee is gone', 'Yes — the rule is always safe'],
          correct: 0,
          why: `On sorted data discarding the right end is provably safe. Here ${nums[Rn]} pairs with ${nums[1]} (index 1) to make ${nums[Rn] + nums[1]} — the rule is about to throw away half of the real answer.`
        };
      }
      steps.push(cmp);
      const old = tooSmall ? L : Rn;
      if (tooSmall) L++; else Rn--;
      steps.push({
        line: tooSmall ? 5 : 6,
        caption: tooSmall ? `L moves to ${L}` : `R moves to ${Rn} — value ${nums[old]} was discarded`,
        narration: `Index ${old}, value ${nums[old]}, is now marked as ruled out. On unsorted data that mark can be a lie.`,
        state: {
          arr: [...nums], ptrs: { L, R: Rn },
          marks: { [old]: 'out', [tooSmall ? L : Rn]: 'cmp' },
          aux: [{ label: 'target', value: target }, { label: 'sum', value: s }]
        },
        fx: { type: 'move', indices: [tooSmall ? L : Rn] }
      });
    }
    steps.push({
      line: 2,
      caption: `L < R fails — loop ends. No pair found.`,
      narration: `The loop ends with no answer. But look: ${nums.slice(1, 3).join(' + ')} = ${nums[1] + nums[2]}, and that equals ${target}. The pair existed. The algorithm threw it away, because it silently assumed sorted order.`,
      state: {
        arr: [...nums], ptrs: { L, R: Rn },
        marks: { 1: 'win', 2: 'win' },
        aux: [{ label: 'target', value: target }, { label: 'missed', value: `${nums[1]}+${nums[2]}=${nums[1] + nums[2]}`, done: true }]
      },
      fx: { type: 'buzz' }
    });
    return {
      code: [
        '# same code, unsorted input ⚠️',
        'L, R = 0, len(nums) - 1',
        'while L < R:',
        '    s = nums[L] + nums[R]',
        '    if s == target: return [L + 1, R + 1]',
        '    elif s < target: L += 1',
        '    else: R -= 1',
        '# ends with NO answer…'
      ],
      steps
    };
  }

  /* ── P4 · Sliding window (min size subarray sum ≥ target) ── */
  function minSubarrayTrace(nums, target, mode) {
    const n = nums.length;
    const steps = [];
    const winMarks = (l, r, extra = {}) => {
      const m = {};
      if (r >= l) for (let i = l; i <= r; i++) m[i] = 'win';
      Object.keys(extra).forEach(k => { m[k] = extra[k]; });
      return m;
    };

    steps.push({
      line: 0,
      caption: 'best = ∞ · left = 0 · total = 0',
      narration: `We track the best length found so far, the left edge of the window, and the running total. The window starts empty.`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 'target', value: target }, { label: 'total', value: 0 }, { label: 'best', value: '∞' }] },
      fx: { type: 'init' }
    });

    let left = 0, total = 0, best = Infinity;
    let predicted = false;

    for (let right = 0; right < n; right++) {
      /* decision: grow */
      if (mode === 'drive') {
        steps.push({
          line: 1,
          caption: `total = ${total} < ${target} — window not valid yet`,
          narration: '',
          state: {
            arr: [...nums], ptrs: right > left ? { L: left, R: right - 1 } : (right > 0 ? { L: left, R: right - 1 } : {}),
            marks: right > 0 ? winMarks(left, right - 1) : {},
            aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best === Infinity ? '∞' : best }]
          },
          fx: { type: 'none' },
          drive: {
            prompt: `total = ${total} is below the target ${target}. Grow right, or record & shrink?`,
            options: ['Grow: total += nums[R]', 'Record best & shrink'],
            correct: 0,
            why: 'The window is not valid yet — only growing can make the total reach the target.',
            hint: 'Is total ≥ target? If not, shrinking only makes it smaller.'
          }
        });
      }

      total += nums[right];
      steps.push({
        line: 2,
        caption: `R = ${right} · total += ${nums[right]} → ${total}`,
        narration: `The window grows to include index ${right}. Total is now ${total}.`,
        state: {
          arr: [...nums], ptrs: { L: left, R: right },
          marks: winMarks(left, right),
          aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best === Infinity ? '∞' : best }]
        },
        fx: { type: 'grow' }
      });

      while (total >= target) {
        const len = right - left + 1;
        /* watch-mode prediction on the first valid window */
        if (mode === 'watch' && !predicted) {
          predicted = true;
          steps.push({
            line: 3,
            caption: `total = ${total} ≥ ${target} — the window is VALID`,
            narration: `The total, ${total}, reached the target. The window is valid now. Pause: what should we do with a valid window?`,
            state: {
              arr: [...nums], ptrs: { L: left, R: right },
              marks: winMarks(left, right, { [left]: 'cmp' }),
              aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best === Infinity ? '∞' : best }]
            },
            fx: { type: 'compare', indices: [left, right] },
            predict: {
              q: `The window [${left}..${right}] is valid (total ${total} ≥ ${target}). What next?`,
              options: ['Record its length, then try shrinking it', 'Keep growing — bigger is better', 'Restart the window'],
              correct: 0,
              why: 'We want the SMALLEST valid window. We already recorded this one, so shrinking can only find something better — never worse.'
            }
          });
        }

        best = Math.min(best, len);
        steps.push({
          line: 4,
          caption: `valid! len ${len} → best = ${best}`,
          narration: `Window length ${len} is valid, so best becomes ${best}. Now shrink from the left to look for something smaller.`,
          state: {
            arr: [...nums], ptrs: { L: left, R: right },
            marks: winMarks(left, right, { [left]: 'cmp' }),
            aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best }]
          },
          fx: { type: 'compare', indices: [left, right] }
        });

        /* decision: shrink */
        if (mode === 'drive') {
          steps.push({
            line: 3,
            caption: `total = ${total} ≥ ${target} — still valid`,
            narration: '',
            state: {
              arr: [...nums], ptrs: { L: left, R: right },
              marks: winMarks(left, right, { [left]: 'cmp' }),
              aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best }]
            },
            fx: { type: 'none' },
            drive: {
              prompt: `total = ${total} still ≥ ${target}. Grow right, or record & shrink?`,
              options: ['Record best & shrink', 'Grow: total += nums[R]'],
              correct: 0,
              why: 'While the window is valid we keep shrinking — the best-so-far is already recorded, so shrinking is free.',
              hint: 'We want the smallest valid window. What does growing do to the size?'
            }
          });
        }

        total -= nums[left];
        steps.push({
          line: 5,
          caption: `total -= ${nums[left]} → ${total} · L moves to ${left + 1}`,
          narration: `We remove ${nums[left]} from the total and slide the left edge right.`,
          state: {
            arr: [...nums], ptrs: { L: Math.min(left + 1, right), R: right },
            marks: winMarks(Math.min(left + 1, right), right, { [left]: 'out' }),
            aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best }]
          },
          fx: { type: 'shrink' }
        });
        left++;
      }
    }

    /* final reveal */
    let bl = -1;
    outer: for (let l = 0; l < n; l++) {
      let t = 0;
      for (let r = l; r < n; r++) {
        t += nums[r];
        if (t >= target && (r - l + 1) === best) { bl = l; break outer; }
      }
    }
    steps.push({
      line: 7,
      caption: `return best = ${best}`,
      narration: `Every element entered the window once and left at most once, so this is linear time. The best valid window had length ${best}.`,
      state: {
        arr: [...nums], ptrs: bl >= 0 ? { L: bl, R: bl + best - 1 } : {},
        marks: bl >= 0 ? winMarks(bl, bl + best - 1) : {},
        aux: [{ label: 'target', value: target }, { label: 'best', value: best, done: true }]
      },
      fx: { type: 'found' }
    });

    return {
      code: [
        'best, left, total = inf, 0, 0',
        'for right in range(len(nums)):',
        '    total += nums[right]',
        '    while total >= target:',
        '        best = min(best, right - left + 1)',
        '        total -= nums[left]',
        '        left += 1',
        'return best'
      ],
      steps
    };
  }

  /* ── P4 · Misconception: window + negatives ── */
  function windowBugTrace(nums, target) {
    /* runs the SAME algorithm on data where monotonicity breaks */
    const n = nums.length;
    const steps = [];
    steps.push({
      line: 0,
      caption: '⚠️ negatives present — watch the assumption break',
      narration: `Same window code, but this array hides a negative number. The window logic assumes growing always helps the total reach the target. Negatives break that.`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 'target', value: target }, { label: 'total', value: 0 }, { label: 'best', value: '∞' }] },
      fx: { type: 'init' }
    });
    let left = 0, total = 0, best = Infinity;
    for (let right = 0; right < n; right++) {
      total += nums[right];
      steps.push({
        line: 2,
        caption: `R = ${right} · total = ${total}`,
        narration: `Index ${right} enters. Total is now ${total}.${nums[right] < 0 ? ' Notice: growing just SUBTRACTED from the total.' : ''}`,
        state: {
          arr: [...nums], ptrs: { L: left, R: right },
          marks: (() => { const m = {}; for (let i = left; i <= right; i++) m[i] = 'win'; return m; })(),
          aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best === Infinity ? '∞' : best }]
        },
        fx: { type: 'grow' }
      });
      while (total >= target) {
        const len = right - left + 1;
        best = Math.min(best, len);
        steps.push({
          line: 4,
          caption: `valid → best = ${best}`,
          narration: `The window is valid, so best becomes ${best}. Shrink.`,
          state: {
            arr: [...nums], ptrs: { L: left, R: right },
            marks: (() => { const m = {}; for (let i = left; i <= right; i++) m[i] = 'win'; m[left] = 'cmp'; return m; })(),
            aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best }]
          },
          fx: { type: 'compare', indices: [left, right] }
        });
        total -= nums[left];
        steps.push({
          line: 5,
          caption: `total -= ${nums[left]} → ${total} · stop shrinking`,
          narration: `After removing ${nums[left]} the total is ${total}, below the target, so the shrink loop stops. The window algorithm believes it is done with this region.`,
          state: {
            arr: [...nums], ptrs: { L: Math.min(left + 1, right), R: right },
            marks: (() => { const m = {}; m[left] = 'out'; return m; })(),
            aux: [{ label: 'target', value: target }, { label: 'total', value: total }, { label: 'best', value: best }]
          },
          fx: { type: 'shrink' }
        });
        left++;
      }
    }
    steps.push({
      line: 7,
      caption: `return best = ${best} — but the true answer is 1!`,
      narration: `The algorithm reports ${best}. But the single element ${nums[n - 1]} at the end is at least ${target} on its own — the true answer is 1. The shrink loop stopped early because removing values is not always a loss when negatives are inside. Monotonicity was the whole contract.`,
      state: {
        arr: [...nums], ptrs: { L: n - 1, R: n - 1 },
        marks: { [n - 1]: 'win' },
        aux: [{ label: 'target', value: target }, { label: 'algorithm said', value: best, done: true }, { label: 'truth', value: 1 }]
      },
      fx: { type: 'buzz' }
    });
    return {
      code: [
        '# window code, negatives ⚠️',
        'best, left, total = inf, 0, 0',
        'for right in range(len(nums)):',
        '    total += nums[right]',
        '    while total >= target:',
        '        best = min(best, right - left + 1)',
        '        total -= nums[left]',
        '        left += 1',
        'return best'
      ],
      steps
    };
  }

  /* ── P6 · Prefix sum ── */
  function prefixTrace(nums, queries, mode) {
    const steps = [];
    const prefix = [0];
    nums.forEach(x => prefix.push(prefix[prefix.length - 1] + x));

    steps.push({
      line: 0,
      caption: 'prefix = [0]',
      narration: `The prefix array starts with a single zero. That zero looks harmless — it is actually the trick that removes every special case. Watch.`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [], row2: { label: 'prefix', arr: [0] } },
      fx: { type: 'init' }
    });

    nums.forEach((x, i) => {
      steps.push({
        line: 2,
        caption: `prefix[${i + 1}] = ${prefix[i]} + ${x} = ${prefix[i + 1]}`,
        narration: `Prefix index ${i + 1} holds the sum of everything up to and including ${x}: that is ${prefix[i + 1]}.`,
        state: {
          arr: [...nums], ptrs: { i }, marks: { [i]: 'cmp' }, aux: [],
          row2: { label: 'prefix', arr: prefix.slice(0, i + 2), marks: { [i + 1]: 'write' } }
        },
        fx: { type: 'build', value: prefix[i + 1] }
      });
    });

    queries.forEach((q, qi) => {
      const [l, r] = q;
      const diff = `prefix[${r + 1}] − prefix[${l}]`;
      const answer = prefix[r + 1] - prefix[l];

      const qStep = {
        line: 4,
        caption: `sumRange(${l}, ${r}) = ${diff}`,
        narration: `Query: sum of indices ${l} through ${r}. In a static array this is one subtraction: prefix ${r + 1} minus prefix ${l}.`,
        state: {
          arr: [...nums], ptrs: {}, marks: { [l]: 'cmp', [r]: 'cmp' },
          aux: [{ label: `sumRange(${l},${r})`, value: '?' }],
          row2: { label: 'prefix', arr: [...prefix], ptrs: { l, 'r+1': r + 1 }, marks: { [l]: 'cmp', [r + 1]: 'cmp' } }
        },
        fx: { type: 'compare', indices: [l, r + 1] }
      };

      if (mode === 'drive') {
        /* decision: which difference? vary the correct index */
        const formulas = [
          { text: `prefix[${r + 1}] − prefix[${l}]`, ok: true },
          { text: `prefix[${r}] − prefix[${l}]`, ok: false },
          { text: `prefix[${r + 1}] − prefix[${l + 1}]`, ok: false }
        ];
        const rotate = qi % 3;
        const shifted = formulas.slice(rotate).concat(formulas.slice(0, rotate));
        const correctIdx = shifted.findIndex(f => f.ok);
        qStep.drive = {
          prompt: `sumRange(${l}, ${r}) — which subtraction answers it?`,
          options: shifted.map(f => f.text),
          correct: correctIdx,
          why: `prefix[${r + 1}] sums indices 0..${r} and prefix[${l}] sums 0..${l - 1}. The difference is exactly indices ${l}..${r} = ${answer}.`,
          hint: `One end must cover everything up to r — the other must stop just BEFORE l.`
        };
        qStep.caption = `sumRange(${l}, ${r}) — pick the right subtraction`;
        qStep.narration = '';
      } else if (qi === 0) {
        qStep.predict = {
          q: `sumRange(${l}, ${r}): what does prefix[${r + 1}] − prefix[${l}] equal?`,
          options: [String(answer), String(prefix[r + 1]), String(prefix[l]), String(answer + 1)],
          correct: 0,
          why: `${prefix[r + 1]} − ${prefix[l]} = ${answer}. One subtraction, no loop.`
        };
      } else if (qi === 1 && mode === 'watch') {
        qStep.predict = {
          q: `Now a query that starts at index 0: sumRange(0, ${r}). Which subtraction works?`,
          options: [`prefix[${r + 1}] − prefix[0]`, `prefix[${r + 1}] − prefix[1]`, `This case needs a loop`],
          correct: 0,
          why: `prefix[0] is the leading zero — it represents "the sum of nothing". That is exactly what a query starting at index 0 needs to subtract.`
        };
      }
      steps.push(qStep);

      steps.push({
        line: 4,
        caption: `= ${answer}`,
        narration: `${prefix[r + 1]} minus ${prefix[l]} is ${answer}. The answer arrives in constant time — no matter how long the array is.`,
        state: {
          arr: [...nums], ptrs: {}, marks: { [l]: 'win', [r]: 'win' },
          aux: [{ label: `sumRange(${l},${r})`, value: answer, done: qi === queries.length - 1 }],
          row2: { label: 'prefix', arr: [...prefix], ptrs: { l, 'r+1': r + 1 }, marks: { [l]: 'win', [r + 1]: 'win' } }
        },
        fx: { type: 'found' }
      });
    });

    return {
      code: [
        'prefix = [0]',
        'for x in nums:',
        '    prefix.append(prefix[-1] + x)',
        '',
        'def sumRange(l, r):',
        '    return prefix[r + 1] - prefix[l]'
      ],
      steps
    };
  }

  /*  BRUTE-FORCE LAB TRACES (phase 2 — feel the cost)      */
  /* ═══════════════════════════════════════════════════════ */

  /* ── P1 · brute two-sum: check every pair ── */
  function twoSumBruteTrace(nums, target) {
    const n = nums.length;
    const totalPairs = n * (n - 1) / 2;
    const steps = [{
      line: 0,
      caption: 'the plain way',
      narration: `The obvious plan: try every pair. Before we run it — for ${n} numbers, how many pairs is that?`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 'pairs', value: '?' }] },
      fx: { type: 'init' },
      predict: {
        q: `n = ${n}. How many pairs will the plain plan check?`,
        options: [`${n}`, `${totalPairs}`, `${n * n}`],
        correct: 1,
        why: `Every number pairs with every LATER one: ${n - 1} + ${n - 2} + … + 1 = ${totalPairs}. Roughly half of n squared.`
      }
    }];
    let checks = 0;
    for (let j = 1; j < n; j++) {
      checks++;
      const a = nums[0], b = nums[j], s = a + b;
      const hit = s === target;
      steps.push({
        line: 1,
        caption: `pair (0,${j}): ${a}+${b}=${s}`,
        narration: `${a} plus ${b} is ${s}.${hit ? ` A match — but it took ${checks} checks to get here.` : ' Not the target. Next pair.'}`,
        state: { arr: [...nums], ptrs: { L: 0, R: j }, marks: { 0: 'cmp', [j]: 'cmp' }, aux: [{ label: 'checks', value: checks }] },
        fx: { type: 'compare', indices: [0, j] }
      });
      if (hit) break;
    }
    steps.push({
      line: 1,
      caption: 'now scale it up',
      narration: `${checks} checks for ${n} numbers — and the answer only came that fast because it lived near the start. At a hundred thousand numbers this plan does about five billion checks.`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 'checks', value: checks }, { label: 'n = 100,000', value: '≈ 5,000,000,000' }] },
      fx: { type: 'buzz' }
    });
    return {
      code: [
        '# the plain plan: try every pair',
        'for i in range(n):',
        '    for j in range(i + 1, n):',
        '        if nums[i] + nums[j] == target:',
        '            return [i, j]'
      ],
      steps
    };
  }

  /* ── P4 · brute min-subarray: try every stretch ── */
  function minSubarrayBruteTrace(nums, target) {
    const n = nums.length;
    const totalStretches = n * (n + 1) / 2;
    const steps = [{
      line: 0,
      caption: 'the plain way',
      narration: `The obvious plan: try every consecutive stretch. For ${n} cells, how many stretches are there?`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 'stretches', value: '?' }] },
      fx: { type: 'init' },
      predict: {
        q: `n = ${n}. How many different consecutive stretches exist?`,
        options: [`${n * 2}`, `${totalStretches}`, `${n * n}`],
        correct: 1,
        why: `Every start extends to every end at or after it: ${n} + ${n - 1} + … + 1 = ${totalStretches}.`
      }
    }];
    let checks = 0;
    let best = Infinity;
    [0, 1].forEach(s => {
      let sum = 0;
      for (let e = s; e < n; e++) {
        checks++;
        sum += nums[e];
        const ok = sum >= target;
        steps.push({
          line: 1,
          caption: `start ${s}: sum ${sum}${ok ? ' ✓' : '…'}`,
          narration: `From cell ${s}, the stretch grows — running total ${sum}.${ok ? ` Reached the target with length ${e - s + 1}. Record it, then start all over again one cell later.` : ''}`,
          state: { arr: [...nums], ptrs: { l: s, 'r+1': e + 1 }, marks: {}, aux: [{ label: 'checks', value: checks }, { label: 'best', value: best === Infinity ? '—' : best }] },
          fx: { type: 'grow' }
        });
        if (ok) { best = Math.min(best, e - s + 1); break; }
      }
    });
    steps.push({
      line: 1,
      caption: '…and again, for every start',
      narration: `Each start rescans cells that were already scanned. ${totalStretches} stretches for ${n} cells — and at a hundred thousand cells, about five billion re-reads.`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 'stretches', value: totalStretches }, { label: 'n = 100,000', value: '≈ 5,000,000,000 re-reads' }] },
      fx: { type: 'buzz' }
    });
    return {
      code: [
        '# the plain plan: try every stretch',
        'for start in range(n):',
        '    total = 0',
        '    for end in range(start, n):',
        '        total += nums[end]',
        '        if total >= target:',
        '            best = min(best, end - start + 1)'
      ],
      steps
    };
  }

  /* ── P6 · brute range-sums: rescan for every query ── */
  function prefixBruteTrace(nums, queries) {
    const steps = [{
      line: 0,
      caption: 'the plain way',
      narration: 'The obvious plan: when a question arrives, walk the cells and add them up. Three questions are about to arrive — watch what gets re-read.',
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 're-reads', value: 0 }] },
      fx: { type: 'init' },
      predict: {
        q: '500 questions on a 1,000-cell row, rescanning every time — how many cell-reads is that?',
        options: ['1,500', '50,500', '500,000'],
        correct: 2,
        why: '500 × 1,000 — every single question walks the whole distance again.'
      }
    }];
    let reads = 0;
    queries.forEach(([l, r], qi) => {
      let sum = 0;
      for (let i = l; i <= r; i++) {
        reads++;
        sum += nums[i];
        steps.push({
          line: 1,
          caption: `Q${qi + 1}: read cell ${i} → ${sum}`,
          narration: `Question ${qi + 1} walks cell ${i}. Running total: ${sum}.`,
          state: { arr: [...nums], ptrs: { i }, marks: { [i]: 'cmp' }, aux: [{ label: 're-reads', value: reads }, { label: `Q${qi + 1} sum`, value: sum }] },
          fx: { type: 'write', indices: [i] }
        });
      }
      steps.push({
        line: 1,
        caption: `Q${qi + 1} = ${sum}`,
        narration: `Answer: ${sum}. That was ${r - l + 1} cells re-read — cells earlier questions had already read.`,
        state: { arr: [...nums], ptrs: {}, marks: { [l]: 'win', [r]: 'win' }, aux: [{ label: 're-reads', value: reads }, { label: `Q${qi + 1}`, value: sum, done: qi === queries.length - 1 }] },
        fx: { type: 'found' }
      });
    });
    steps.push({
      line: 1,
      caption: 'same cells, read again and again',
      narration: `${reads} re-reads for three small questions. With five hundred questions on a thousand cells, the plain plan re-reads half a million times.`,
      state: { arr: [...nums], ptrs: {}, marks: {}, aux: [{ label: 're-reads', value: reads }, { label: '500 queries × 1,000 cells', value: '500,000' }] },
      fx: { type: 'buzz' }
    });
    return {
      code: [
        '# the plain plan: rescan for every question',
        'def sum_range(l, r):',
        '    total = 0',
        '    for i in range(l, r + 1):',
        '        total += nums[i]',
        '    return total'
      ],
      steps
    };
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  LESSON DEFINITIONS                                     */
  /* ═══════════════════════════════════════════════════════ */
  /* ── F1 · Foundations: primitive traces ── */
  function primitivesTrace(letters, mode, opts = {}) {
    const n = letters.length;
    const steps = [];
    const preOpts = (opts && Array.isArray(opts.watchPredicts)) ? opts.watchPredicts : [1, 2];
    const allWin = {};
    for (let k = 0; k < n; k++) allWin[k] = 'win';

    steps.push({
      line: 0,
      caption: 'if len(s) < 2: return',
      narration: `Safety guard first — primitive 1's seatbelt. If the row has fewer than two letters there is nothing to swap, so we return before touching any index. We have ${n}: on we go.`,
      state: { arr: letters.slice(), ptrs: {}, marks: {}, aux: [{ label: 'len(s)', value: n }, { label: 'guard', value: 'safe' }] },
      fx: { type: 'init' }
    });
    steps.push({
      line: 1,
      caption: 'L, R = 0, ' + (n - 1),
      narration: `Primitive 1: two named hands. L starts at index 0, R at index ${n - 1} — opposite ends. Nothing has moved yet.`,
      state: { arr: letters.slice(), ptrs: { L: 0, R: n - 1 }, marks: {}, aux: [{ label: 'L', value: 0 }, { label: 'R', value: n - 1 }] },
      fx: { type: 'init' }
    });

    let L = 0, R = n - 1;
    let decisionCount = 0;
    let work = letters.slice();

    while (L < R) {
      const a = work[L], b = work[R];

      const bound = {
        line: 2,
        caption: `L < R ?  ${L} < ${R} → true`,
        narration: `Primitive 2: the loop bound is strict — while L < R. ${L} is less than ${R}, so the body runs.`,
        state: { arr: work.slice(), ptrs: { L, R }, marks: { [L]: 'cmp', [R]: 'cmp' }, aux: [{ label: 'L < R', value: `${L} < ${R} ✓` }] },
        fx: { type: 'compare', indices: [L, R] }
      };
      if (mode === 'watch') {
        if (preOpts.includes(decisionCount)) {
          bound.predict = {
            q: `L = ${L} and R = ${R} — both hands point at letters. What does the loop body do first?`,
            options: ['swap s[L] ↔ s[R]', 'return immediately', 'R -= 1'],
            correct: 0,
            why: `The strict bound L < R is true, so the body runs — and the swap is the body's whole job.`
          };
        }
        steps.push(bound);
      }

      if (mode === 'drive') {
        steps.push({
          line: 2,
          caption: `L = ${L}, R = ${R} — your move`,
          narration: '',
          state: bound.state,
          fx: { type: 'compare', indices: [L, R] },
          drive: {
            prompt: `L = ${L}, R = ${R}, and L < R. What does the loop do?`,
            options: ['swap s[L] ↔ s[R]', 'stop — the loop is over', 'skip this pair'],
            correct: 0,
            why: `${L} < ${R} so the strict bound holds — the swap runs. Primitive 2.`,
            hint: `Compare the two index numbers: is ${L} less than ${R}?`
          }
        });
      }

      const swapped = work.slice();
      swapped[L] = b; swapped[R] = a;
      work = swapped;
      steps.push({
        line: 3,
        caption: `swap ${a} ↔ ${b}`,
        narration: `Primitive 3: the in-place swap. One line — s[${L}], s[${R}] = s[${R}], s[${L}] — trades ${a} and ${b}. Zero extra memory.`,
        state: { arr: swapped.slice(), ptrs: { L, R }, marks: { [L]: 'win', [R]: 'win' }, aux: [{ label: 'swapped', value: `${a} ↔ ${b}` }] },
        fx: { type: 'write' }
      });

      if (mode === 'drive') {
        steps.push({
          line: 3,
          caption: 'swap done — your move',
          narration: '',
          state: { arr: swapped.slice(), ptrs: { L, R }, marks: { [L]: 'win', [R]: 'win' }, aux: [{ label: 'swapped', value: `${a} ↔ ${b}` }] },
          fx: { type: 'write' },
          drive: {
            prompt: 'The swap is done. What comes next?',
            options: ['L += 1 and R -= 1', 'swap the same pair again', 'stop — the loop is over'],
            correct: 0,
            why: 'Explicit steps: both hands walk inward by exactly one. Retired cells are never revisited.',
            hint: 'The ends are finished — where do the hands go next?'
          }
        });
      }

      const oldL = L, oldR = R;
      L += 1; R -= 1;
      const marks2 = {};
      marks2[oldL] = 'out'; marks2[oldR] = 'out';
      if (L <= R) { marks2[L] = 'cmp'; marks2[R] = 'cmp'; }
      steps.push({
        line: 5,
        caption: `L += 1 → ${L}, R -= 1 → ${R}`,
        narration: `Primitive 2 again: explicit steps. The hands walk inward — cells ${oldL} and ${oldR} are retired forever. L is now ${L}, R is now ${R}.`,
        state: { arr: work.slice(), ptrs: { L, R }, marks: marks2, aux: [{ label: 'L', value: L }, { label: 'R', value: R }] },
        fx: { type: 'move', indices: [L, R] }
      });
      decisionCount++;
    }

    const endState = {
      arr: work.slice(), ptrs: { L, R }, marks: allWin,
      aux: [{ label: 'L < R', value: 'false — stop' }, { label: 'done', value: '✓', done: true }]
    };
    const endStep = {
      line: 2,
      caption: `L < R ?  ${L} < ${R} → false — done`,
      narration: `Strict bound fires: ${L} < ${R} is false, so the loop stops. ${n % 2 === 1 ? 'Odd length: the hands MEET on the middle letter — swapped zero times, exactly as the strict bound promises.' : 'Even length: the hands CROSS — every pair swapped exactly once.'} The reversal is complete, with zero extra memory.`,
      state: endState,
      fx: { type: 'found' }
    };
    if (mode === 'watch') {
      endStep.predict = {
        q: `L = ${L} and R = ${R}. What happens next?`,
        options: ['the loop ends — L < R is false', 'swap s[L] ↔ s[R] one more time', 'L += 1 only'],
        correct: 0,
        why: 'The strict bound is the finish line: once the hands meet or cross, the loop stops. That is why the middle of an odd row is never touched.'
      };
      steps.push(endStep);
    } else if (mode === 'drive') {
      steps.push({
        line: 2,
        caption: `L = ${L}, R = ${R} — your move`,
        narration: '',
        state: endState,
        fx: { type: 'compare', indices: [] },
        drive: {
          prompt: `L = ${L}, R = ${R}. What now?`,
          options: ['stop — L < R is false, the loop is over', 'swap s[L] ↔ s[R]', 'R -= 1'],
          correct: 0,
          why: `${L} < ${R} is false. The strict bound ends the run — the hands have ${L === R ? 'met on the middle letter' : 'crossed'}.`,
          hint: 'Look at the two index numbers: is the left one still less than the right one?'
        }
      });
      steps.push({
        line: 2,
        caption: 'done — zero extra memory',
        narration: 'That is the whole toolkit working together: guard, init, strict bound, swap, explicit steps. One pass, zero rented memory, done.',
        state: endState,
        fx: { type: 'found' }
      });
    } else {
      steps.push(endStep);
    }

    return {
      code: [
        'def reverse(s):',
        '    if len(s) < 2: return      # guard',
        '    L, R = 0, len(s) - 1       # init: opposite ends',
        '    while L < R:               # bound: strict',
        '        s[L], s[R] = s[R], s[L]# swap: in place',
        '        L += 1                # step',
        '        R -= 1                # step'
      ],
      steps
    };
  }

  function primitivesBruteTrace(letters) {
    const n = letters.length;
    const steps = [{
      line: 0,
      caption: 'the copy plan',
      narration: `The plain way to reverse: rent a second array and copy everything backwards into it. Before we run it — for ${n} letters, how many extra cells does the copy rent?`,
      state: { arr: letters.slice(), ptrs: {}, marks: {}, aux: [{ label: 'extra cells', value: '?' }] },
      fx: { type: 'init' },
      predict: {
        q: `n = ${n}. How many extra cells will the copy plan rent?`,
        options: ['0', String(n), String(n * 2)],
        correct: 1,
        why: `The temp array holds all ${n} values — ${n} extra cells, on every single call.`
      }
    }];
    const temp = [];
    for (let i = n - 1; i >= 0; i--) {
      temp.push(letters[i]);
      steps.push({
        line: 2,
        caption: `temp[${temp.length - 1}] = s[${i}] = ${letters[i]}`,

        state: {
