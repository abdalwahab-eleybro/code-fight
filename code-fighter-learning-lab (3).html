<script>
/* ═══════════════════════════════════════════════════════════ */
/*  04-renderers.js — 11 question type renderers               */
/*  Depends on: 03-questions.js                                */
/* ═══════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

CF.Renderers = (() => {

  /* ═══ MAIN ENTRY ═══ */
  // mount(question, containerEl, onAnswer)
  // onAnswer(submittedValue) — engine compares against correct answer
  function mount(q, container, onAnswer) {
    container.innerHTML = '';
    container.className = 'question-panel type-' + q.type;

    // Type-specific header
    const badge = document.createElement('div');
    badge.className = 'question-badge';
    badge.textContent = CF.Questions.getTypeMeta(q.type).label;
    container.appendChild(badge);

    // Title + prompt
    const title = document.createElement('h3');
    title.className = 'question-title';
    title.textContent = q.title || '';
    container.appendChild(title);

    if (q.prompt) {
      const p = document.createElement('p');
      p.className = 'question-prompt';
      p.textContent = q.prompt;
      container.appendChild(p);
    }

    if (q.code) {
      const pre = document.createElement('pre');
      pre.className = 'question-code';
      pre.textContent = q.code;
      container.appendChild(pre);
    }

    // Dispatch to type renderer
    const body = document.createElement('div');
    body.className = 'question-body';
    container.appendChild(body);

    const handlers = {
      pattern:    renderMCQ,
      complexity: renderMCQGrid,
      state:      renderMCQ,
      trace:      renderMCQ,
      invariant:  renderMCQ,
      bug:        renderMCQ,
      nextline:   renderMCQ,
      chips:      renderChips,
      order:      renderOrder,
      flowchart:  renderFlowchart,
      numeric:    renderNumeric
    };
    (handlers[q.type] || renderMCQ)(q, body, onAnswer);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  MCQ — 4-6 options, single tap submits                     */
  /* ═══════════════════════════════════════════════════════ */
  function renderMCQ(q, body, onAnswer) {
    const grid = document.createElement('div');
    grid.className = 'mcq-list';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'mcq-option';
      btn.dataset.letter = String.fromCharCode(65 + i);
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        lockAll(grid);
        onAnswer(i);
      });
      grid.appendChild(btn);
    });
    body.appendChild(grid);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  MCQ GRID — 6-8 options for complexity questions           */
  /* ═══════════════════════════════════════════════════════ */
  function renderMCQGrid(q, body, onAnswer) {
    const grid = document.createElement('div');
    grid.className = 'mcq-grid';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'mcq-option grid-option';
      btn.dataset.letter = String.fromCharCode(65 + i);
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        lockAll(grid);
        onAnswer(i);
      });
      grid.appendChild(btn);
    });
    body.appendChild(grid);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  CHIPS — tap the token that fills the blank                */
  /* ═══════════════════════════════════════════════════════ */
  function renderChips(q, body, onAnswer) {
    const row = document.createElement('div');
    row.className = 'chips-row';
    q.tokens.forEach((tok, i) => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = tok;
      chip.addEventListener('click', () => {
        lockAll(row);
        onAnswer(i);
      });
      row.appendChild(chip);
    });
    body.appendChild(row);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  ORDER — tap lines in sequence                             */
  /* ═══════════════════════════════════════════════════════ */
  function renderOrder(q, body, onAnswer) {
    const list = document.createElement('div');
    list.className = 'order-list';
    const picked = [];

    const items = q.lines.map((line, i) => ({ line, i }));
    // Shuffle display order so it's not the answer
    const shuffled = CF.Questions.shuffle(items);

    shuffled.forEach(({ line, i }) => {
      const el = document.createElement('button');
      el.className = 'order-item';
      el.dataset.idx = i;
      el.innerHTML = `<span class="order-slot"></span><span class="order-line">${escapeHtml(line)}</span>`;

      el.addEventListener('click', () => {
        const pos = picked.indexOf(i);
        if (pos >= 0) {
          picked.splice(pos, 1);
        } else {
          picked.push(i);
        }
        refreshOrderUI();
        if (picked.length === q.lines.length) {
          submitBtn.disabled = false;
        } else {
          submitBtn.disabled = true;
        }
      });
      list.appendChild(el);
    });

    body.appendChild(list);

    const submitBtn = document.createElement('button');
    submitBtn.className = 'submit-answer';
    submitBtn.textContent = 'Submit Order';
    submitBtn.disabled = true;
    submitBtn.addEventListener('click', () => {
      lockAll(list);
      submitBtn.disabled = true;
      onAnswer(picked.slice());
    });
    body.appendChild(submitBtn);

    function refreshOrderUI() {
      list.querySelectorAll('.order-item').forEach(el => {
        const i = Number(el.dataset.idx);
        const pos = picked.indexOf(i);
        const slot = el.querySelector('.order-slot');
        slot.textContent = pos >= 0 ? String(pos + 1) : '';
        el.classList.toggle('picked', pos >= 0);
      });
    }
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  FLOWCHART — highlighted decision node + branch options    */
  /* ═══════════════════════════════════════════════════════ */
  function renderFlowchart(q, body, onAnswer) {
    // Highlighted decision node
    const node = document.createElement('div');
    node.className = 'flowchart-node';
    node.innerHTML = `
      <svg viewBox="0 0 240 70" width="240" height="70">
        <polygon points="120,4 236,35 120,66 4,35"
                 fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
        <text x="120" y="40" text-anchor="middle"
              font-family="monospace" font-weight="800" font-size="14"
              fill="#b45309">${escapeHtml(q.highlightNode || '?')}</text>
      </svg>
    `;
    body.appendChild(node);

    const caption = document.createElement('div');
    caption.className = 'flowchart-caption';
    caption.textContent = 'Which branch?';
    body.appendChild(caption);

    const row = document.createElement('div');
    row.className = 'chips-row';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'chip flowchart-chip';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        lockAll(row);
        onAnswer(i);
      });
      row.appendChild(btn);
    });
    body.appendChild(row);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  NUMERIC — number pad                                      */
  /* ═══════════════════════════════════════════════════════ */
  function renderNumeric(q, body, onAnswer) {
    let value = '';
    let negative = false;

    const display = document.createElement('div');
    display.className = 'numeric-display';
    display.textContent = '0';
    body.appendChild(display);

    const pad = document.createElement('div');
    pad.className = 'numeric-pad';

    const keys = ['7','8','9','4','5','6','1','2','3','±','0','⌫'];
    keys.forEach(k => {
      const b = document.createElement('button');
      b.className = 'numeric-key';
      b.textContent = k;
      if (k === '⌫') b.classList.add('danger');
      if (k === '±') b.classList.add('ghost');
      b.addEventListener('click', () => {
        if (k === '⌫') value = value.slice(0, -1);
        else if (k === '±') negative = !negative;
        else if (value.length < 6) value += k;
        display.textContent = (negative ? '−' : '') + (value || '0');
      });
      pad.appendChild(b);
    });
    body.appendChild(pad);

    const submit = document.createElement('button');
    submit.className = 'submit-answer';
    submit.textContent = 'Submit';
    submit.disabled = true;
    submit.addEventListener('click', () => {
      lockAll(pad);
      submit.disabled = true;
      onAnswer((negative ? -1 : 1) * Number(value || 0));
    });
    body.appendChild(submit);

    // Enable/disable submit as user types
    const observer = new MutationObserver(() => {
      submit.disabled = value === '';
    });
    observer.observe(display, { childList: true });
  }

  /* ═══ HELPERS ═══ */
  function lockAll(parent) {
    parent.querySelectorAll('button').forEach(b => b.disabled = true);
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /* ═══ CHECK ═══ */
  // Returns true if the submitted answer matches the correct answer for this type
  function checkAnswer(q, submitted) {
    switch (q.type) {
      case 'chips':
      case 'nextline':
      case 'flowchart':
      case 'pattern':
      case 'complexity':
      case 'state':
      case 'trace':
      case 'invariant':
      case 'bug':
        return submitted === q.correct;

      case 'numeric':
        return Number(submitted) === Number(q.answer);

      case 'order': {
        const correct = q.correctOrder || [];
        if (!Array.isArray(submitted) || submitted.length !== correct.length) return false;
        for (let i = 0; i < correct.length; i++) {
          if (submitted[i] !== correct[i]) return false;
        }
        return true;
      }

      default:
        return false;
    }
  }

  // Human-readable correct answer for feedback
  function formatCorrect(q) {
    switch (q.type) {
      case 'pattern':
      case 'complexity':
      case 'state':
      case 'trace':
      case 'invariant':
      case 'bug':
      case 'nextline':
      case 'flowchart':
        return q.options[q.correct];
      case 'chips':
        return q.tokens[q.correct];
      case 'numeric':
        return String(q.answer);
      case 'order':
        return q.correctOrder.map(i => q.lines[i]).join(' → ');
      default:
        return '?';
    }
  }

  return { mount, checkAnswer, formatCorrect };
})();

<script>
/* ═══════════════════════════════════════════════════════════ */
/*  07-spaced.js — Spaced repetition + weak spot analyzer      */
/*  Depends on: 01-state.js, 03-questions.js                    */
/* ═══════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

CF.Spaced = (() => {
  const S = CF.State;
  const Q = CF.Questions;

  /* ═══════════════════════════════════════════════════════ */
  /*  INTERVALS — strength → ms until next review              */
  /* ═══════════════════════════════════════════════════════ */
  const HOUR = 3600 * 1000;
  const DAY  = 24 * HOUR;
  const INTERVALS = [
    4 * HOUR,     // strength 0 — just failed, see again soon
    1 * DAY,      // strength 1
    3 * DAY,      // strength 2
    7 * DAY,      // strength 3
    14 * DAY,     // strength 4
    30 * DAY      // strength 5 — mastered
  ];

  function nextDueAt(strength, fromTime) {
    const interval = INTERVALS[Math.min(strength, INTERVALS.length - 1)];
    return (fromTime || Date.now()) + interval;
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  RECORD ANSWER                                           */
  /* ═══════════════════════════════════════════════════════ */
  function recordAnswer(q, correct, hintUsed) {
    if (!q || !q.id) return;
    const now = Date.now();
    const history = S.profile.questionHistory;
    const entry = history[q.id] || { strength: 0, lastSeen: 0, attempts: 0, correct: 0 };

    entry.lastSeen = now;
    entry.attempts++;

    if (correct && !hintUsed) {
      entry.correct++;
      entry.strength = Math.min(5, (entry.strength || 0) + 1);
    } else if (correct && hintUsed) {
      entry.correct++;
      // Hint means partial credit — no strength gain, no loss
    } else {
      entry.strength = Math.max(0, (entry.strength || 0) - 2);
    }

    entry.dueAt = nextDueAt(entry.strength, now);
    history[q.id] = entry;

    // Update pattern stats (for weak spot recommender)
    const pStats = S.profile.patternStats[q.pattern] || { wrong: [], correct: 0 };
    if (correct) {
      pStats.correct++;
    } else {
      pStats.wrong.push(now);
      // Keep only last 30 days of wrong answers
      const cutoff = now - 30 * DAY;
      pStats.wrong = pStats.wrong.filter(t => t > cutoff);
    }
    S.profile.patternStats[q.pattern] = pStats;

    S.save();
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  GET DUE QUESTIONS                                       */
  /* ═══════════════════════════════════════════════════════ */
  function getDueQuestions(limit) {
    const now = Date.now();
    const history = S.profile.questionHistory;
    const due = [];

    Object.keys(history).forEach(id => {
      const entry = history[id];
      if (!entry.dueAt) return;
      if (entry.dueAt > now) return;
      const q = Q.getById(id);
      if (q) due.push({ q, entry });
    });

    // Sort by weakest first, then oldest due
    due.sort((a, b) => {
      if (a.entry.strength !== b.entry.strength) return a.entry.strength - b.entry.strength;
      return a.entry.dueAt - b.entry.dueAt;
    });

    return due.map(d => d.q).slice(0, limit || 5);
  }

  function countDue() {
    return getDueQuestions(999).length;
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  BLEND QUESTIONS FOR A FIGHT                             */
  /* ═══════════════════════════════════════════════════════ */
  // Campaign levels: 70% pattern-specific + 30% due review (if any due).
  function pickWithReview(config) {
    const total = config.questions || 6;
    const dueCount = Math.min(Math.floor(total * 0.3), countDue());
    const dueQs = dueCount > 0 ? getDueQuestions(dueCount) : [];
    const dueIds = new Set(dueQs.map(q => q.id));

    // Fill remaining slots from the pattern pool, excluding due ones
    const need = total - dueQs.length;
    let pool = Q.BANK.filter(q =>
      q.pattern === config.pattern &&
      q.difficulty <= (config.diff || 3) &&
      !dueIds.has(q.id)
    );

    if (pool.length < need) {
      pool = Q.BANK.filter(q => q.pattern === config.pattern && !dueIds.has(q.id));
    }
    if (pool.length < need) {
      pool = Q.BANK.filter(q => !dueIds.has(q.id));
    }

    const fresh = Q.shuffle(pool).slice(0, need);
    return Q.shuffle([...dueQs, ...fresh]);
  }

  // Review run: pure due questions
  function pickReviewQuestions(limit) {
    return getDueQuestions(limit || 5);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  WEAK SPOT ANALYZER                                      */
  /* ═══════════════════════════════════════════════════════ */
  const WINDOW_MS = 7 * DAY;

  function findWeakSpots() {
    const cutoff = Date.now() - WINDOW_MS;
    const out = [];

    Object.keys(S.profile.patternStats).forEach(pid => {
      const stats = S.profile.patternStats[pid];
      const recentWrong = (stats.wrong || []).filter(t => t > cutoff).length;
      const totalAttempts = recentWrong + (stats.correct || 0);
      if (recentWrong < 3) return;

      const accuracy = totalAttempts > 0 ? stats.correct / totalAttempts : 0;
      if (accuracy >= 0.6) return;

      out.push({
        patternId: pid,
        patternName: getPatternName(pid),
        wrongCount: recentWrong,
        accuracy: Math.round(accuracy * 100)
      });
    });

    return out.sort((a, b) => b.wrongCount - a.wrongCount);
  }

  function getPatternName(pid) {
    const C = CF.Campaign;
    const pattern = C.levels.find(l => l.pattern === pid);
    return pattern ? pattern.patternName : pid;
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  STATS FOR UI                                            */
  /* ═══════════════════════════════════════════════════════ */
  function getStats() {
    const history = S.profile.questionHistory;
    const ids = Object.keys(history);
    let mastered = 0, learning = 0, struggling = 0;
    ids.forEach(id => {
      const s = history[id].strength || 0;
      if (s >= 4) mastered++;
      else if (s >= 2) learning++;
      else struggling++;
    });
    return { total: ids.length, mastered, learning, struggling, due: countDue() };
  }

  function resetAll() {
    S.profile.questionHistory = {};
    S.profile.patternStats = {};
    S.save();
  }

  return {
    recordAnswer,
    getDueQuestions,
    countDue,
    pickWithReview,
    pickReviewQuestions,
    findWeakSpots,
    getStats,
    resetAll,
    nextDueAt
  };
})();





</script>

  function purchase(id) {
    const item = ITEMS.find(i => i.id === id);
    if (!item) return { ok: false, reason: 'Unknown item' };

    const cost = getCost(item);
    if (cost === null) return { ok: false, reason: 'Already owned' };
    if (S.profile.coins < cost) return { ok: false, reason: 'Not enough coins' };

    S.profile.coins -= cost;

    if (id === 'comboShield') {
      S.profile.upgrades.comboShield = true;
    } else {
      S.profile.upgrades[id] = (S.profile.upgrades[id] || 0) + 1;
    }

    S.save();
    return { ok: true, cost };
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  RENDER                                                  */
  /* ═══════════════════════════════════════════════════════ */
  function render(container, onPurchase) {
    const coins = S.profile.coins;

    let html = `
      <div class="shop-header">
        <button class="back-btn" id="shopBack">← Menu</button>
        <div style="flex:1">
          <div class="map-title">Shop</div>
          <div class="map-sub">Spend coins on permanent upgrades and consumables</div>
        </div>
        <div class="shop-wallet">
          <span>🪙</span><strong>${coins}</strong>
        </div>
      </div>
      <div class="shop-grid">
    `;

    ITEMS.forEach(item => {
      const cost = getCost(item);
      const owned = getOwned(item.id);
      const ownedText = owned > 0 ? item.ownedLabel(owned) : '';
      const ownedItem = cost === null;
      const affordable = canAfford(item);

      html += `
        <div class="shop-card ${ownedItem ? 'owned' : ''} ${!affordable && !ownedItem ? 'unaffordable' : ''}" data-id="${item.id}">
          <div class="shop-icon">${item.icon}</div>
          <div class="shop-body">
            <div class="shop-name">
              ${item.name}
              ${ownedText ? `<span class="shop-owned">${ownedText}</span>` : ''}
            </div>
            <div class="shop-desc">${item.desc}</div>
          </div>
          <div class="shop-action">
            ${ownedItem
              ? `<div class="shop-cost owned-text">✓ Owned</div>`
              : `<button class="shop-buy" data-id="${item.id}" ${!affordable ? 'disabled' : ''}>
                   <span class="cost-icon">🪙</span>${cost}
                 </button>`
            }
          </div>
        </div>
      `;
    });

    html += `</div>
      <div class="shop-footer" id="shopFooter"></div>
    `;

    container.innerHTML = html;

    // Wire up
    container.querySelector('#shopBack')?.addEventListener('click', () => onPurchase('back'));
    container.querySelectorAll('.shop-buy').forEach(btn => {
      btn.addEventListener('click', () => onPurchase(btn.dataset.id));
    });
  }

  function showToast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'shop-toast ' + (kind || '');
    el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 400);
    }, 2000);
  }

  return { ITEMS, render, purchase, showToast, getCost, getOwned };
})();

<script>
/* ═══════════════════════════════════════════════════════════ */
/*  09-music.js — Procedural chiptune engine                   */
/*  No external files. Web Audio API only.                     */
/*  Depends on: 01-state.js                                     */
/* ═══════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

CF.Music = (() => {
  const S = CF.State;

  let actx = null;
  let masterGain = null;
  let currentTrack = null;       // 'menu' | 'combat' | 'boss' | 'blitz' | null
  let schedulerID = null;
  let nextNoteTime = 0;
  let stepIndex = 0;

  /* ═══════════════════════════════════════════════════════ */
  /*  AUDIO CONTEXT                                           */
  /* ═══════════════════════════════════════════════════════ */
  function init() {
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();
      masterGain.gain.value = (S.profile.settings.musicVolume ?? 0.4);
      masterGain.connect(actx.destination);
    } catch (e) {
      console.warn('Audio init failed:', e);
    }
  }

  function updateVolume() {
    if (masterGain) {
      masterGain.gain.value = (S.profile.settings.musicVolume ?? 0.4);
    }
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  TRACKS                                                  */
  /* ═══════════════════════════════════════════════════════ */
  // Each track is a 16-step loop (16th notes).
  // Pattern format: [note, durationInSteps] or null for rest.
  // Notes: 'C3', 'D3', etc. — will be converted to frequency.

  const TRACKS = {
    menu: {
      bpm: 88,
      steps: 16,
      // Slow arpeggio — mysterious, welcoming
      lead: [
        ['D4',1], ['A4',1], ['F4',1], ['D4',1],
        ['F4',1], ['A4',1], ['C5',1], ['A4',1],
        ['Bb4',1], ['F4',1], ['D4',1], ['F4',1],
        ['A4',1], ['F4',1], ['D4',1], null
      ],
      bass: [
        ['D2',4], ['D2',4], ['Bb1',4], ['A1',4]
      ],
      waveLead: 'triangle',
      waveBass: 'sine'
    },
    combat: {
      bpm: 120,
      steps: 16,
      // Driving bass + aggressive lead
      lead: [
        ['D4',1], null, ['F4',1], ['A4',1],
        ['G4',1], null, ['F4',1], null,
        ['D4',1], null, ['F4',1], ['G4',1],
        ['A4',1], ['G4',1], ['F4',1], null
      ],
      bass: [
        ['D2',2], ['D2',2], ['A2',2], ['A2',2],
        ['Bb2',2], ['Bb2',2], ['C3',2], ['C3',2]
      ],
      drums: ['K','H','S','H','K','H','S','H','K','H','S','H','K','H','S','H'],
      waveLead: 'square',
      waveBass: 'sawtooth'
    },
    boss: {
      bpm: 140,
      steps: 16,
      // Darker, phrygian feel
      lead: [
        ['D4',1], ['Eb4',1], ['D4',1], ['A3',1],
        ['Bb3',1], ['A3',1], ['G3',1], ['F3',1],
        ['D4',1], ['Eb4',1], ['F4',1], ['G4',1],
        ['A4',1], ['G4',1], ['F4',1], ['Eb4',1]
      ],
      bass: [
        ['D2',1], ['D2',1], ['D2',1], ['D2',1],
        ['Bb1',1], ['Bb1',1], ['Bb1',1], ['Bb1',1],
        ['G1',1], ['G1',1], ['G1',1], ['G1',1],
        ['A1',1], ['A1',1], ['A1',1], ['A1',1]
      ],
      drums: ['K','H','S','H','K','K','S','H','K','H','S','H','K','K','S','H'],
      waveLead: 'sawtooth',
      waveBass: 'square'
    },
    blitz: {
      bpm: 160,
      steps: 16,
      // Fast, tense
      lead: [
        ['A4',1], ['C5',1], ['E5',1], ['C5',1],
        ['A4',1], ['E4',1], ['A4',1], ['C5',1],
        ['G4',1], ['B4',1], ['D5',1], ['B4',1],
        ['G4',1], ['D4',1], ['G4',1], ['B4',1]
      ],
      bass: [
        ['A2',1], ['A2',1], ['E2',1], ['E2',1],
        ['F2',1], ['F2',1], ['G2',1], ['G2',1],
        ['A2',1], ['A2',1], ['E2',1], ['E2',1],
        ['F2',1], ['F2',1], ['G2',1], ['G2',1]
      ],
      drums: ['K','H','K','H','S','H','K','H','K','H','K','H','S','H','K','H'],
      waveLead: 'square',
      waveBass: 'sawtooth'
    }
  };

  /* ═══════════════════════════════════════════════════════ */
  /*  NOTE → FREQUENCY                                        */
  /* ═══════════════════════════════════════════════════════ */
  const NOTE_OFFSETS = { C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, F:5,
                         'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11 };

  function noteToFreq(note) {
    if (!note) return 0;
    const match = note.match(/^([A-G][#b]?)(\d+)$/);
    if (!match) return 0;
    const semitone = NOTE_OFFSETS[match[1]];
    const octave = parseInt(match[2], 10);
    // A4 = 440 Hz, MIDI note 69
    const midi = (octave + 1) * 12 + semitone;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  SCHEDULER                                               */
  /* ═══════════════════════════════════════════════════════ */
  let stepDuration = 0;
  let activeTrack = null;
  let activeStep = 0;
  let leadSteps = [];       // flattened timeline of {note, step}
  let bassSteps = [];
  let totalSteps = 0;

  function flattenNotes(notes) {
    // Notes format: array of [note, duration] pairs — total duration = steps
    const out = [];
    let step = 0;
    notes.forEach(pair => {
      if (!pair) { step += 1; return; }
      const [note, dur] = pair;
      out.push({ note, step });
      step += dur || 1;
    });
    return out;
  }

  function flattenBass(notes) {
    // Bass format: array of [note, duration] pairs spanning the loop
    const out = [];
    let step = 0;
    notes.forEach(pair => {
      if (!pair) return;
      const [note, dur] = pair;
      out.push({ note, step });
      step += dur || 1;
    });
    return out;
  }

  function scheduler() {
    if (!actx || !activeTrack) return;
    const now = actx.currentTime;

    // Schedule ahead
    while (nextNoteTime < now + 0.15) {
      scheduleStep(activeStep, nextNoteTime);
      nextNoteTime += stepDuration;
      activeStep = (activeStep + 1) % totalSteps;
    }
  }

  function scheduleStep(step, time) {
    // Lead
    leadSteps.forEach(({ note, step: s }) => {
      if (s === step) {
        playNote(note, time, stepDuration * 2, activeTrack.waveLead, 0.09);
      }
    });

    // Bass
    bassSteps.forEach(({ note, step: s }) => {
      if (s === step) {
        playNote(note, time, stepDuration * 1.8, activeTrack.waveBass, 0.07);
      }
    });

    // Drums
    const drum = activeTrack.drums && activeTrack.drums[step];
    if (drum === 'K') playKick(time);
    else if (drum === 'S') playSnare(time);
    else if (drum === 'H') playHat(time);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  INSTRUMENTS                                             */
  /* ═══════════════════════════════════════════════════════ */
  function playNote(note, startTime, dur, wave, vol) {
    if (!note) return;
    const freq = noteToFreq(note);
    if (!freq) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = wave;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(vol, startTime + 0.008);
    g.gain.setValueAtTime(vol, startTime + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    o.connect(g).connect(masterGain);
    o.start(startTime);
    o.stop(startTime + dur + 0.05);
  }

  function playKick(time) {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, time);
    o.frequency.exponentialRampToValueAtTime(40, time + 0.14);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.16, time + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.2);
    o.connect(g).connect(masterGain);
    o.start(time); o.stop(time + 0.25);
  }

  function playSnare(time) {
    // Noise burst + tone
    const len = Math.floor(actx.sampleRate * 0.12);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1200;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.11, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
    src.connect(f).connect(g).connect(masterGain);
    src.start(time);
  }

  function playHat(time) {
    const len = Math.floor(actx.sampleRate * 0.05);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 6000;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.04, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
    src.connect(f).connect(g).connect(masterGain);
    src.start(time);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  PUBLIC API                                              */
  /* ═══════════════════════════════════════════════════════ */
  function play(trackName) {
    if (currentTrack === trackName) return;
    init();
    if (!actx) return;

    // iOS autoplay unlock
    if (actx.state === 'suspended') {
      actx.resume().catch(() => {});
    }

    stop();

    const track = TRACKS[trackName];
    if (!track) return;

    activeTrack = track;
    currentTrack = trackName;
    stepDuration = 60 / track.bpm / 4;   // 16th note duration

    leadSteps = flattenNotes(track.lead);
    bassSteps = flattenBass(track.bass);

    // totalSteps = longest
    totalSteps = track.steps || 16;

    activeStep = 0;
    nextNoteTime = actx.currentTime + 0.05;

    schedulerID = setInterval(scheduler, 25);
  }

  function stop() {
    if (schedulerID) {
      clearInterval(schedulerID);
      schedulerID = null;
    }
    currentTrack = null;
    activeTrack = null;
  }

  function setVolume(v) {
    S.profile.settings.musicVolume = Math.max(0, Math.min(1, v));
    updateVolume();
    S.save();
  }

  function isPlaying() { return currentTrack !== null; }

  return { play, stop, setVolume, updateVolume, isPlaying, init };
})();





</script>
<script>
/* ═══════════════════════════════════════════════════════════ */
/*  10-screens.js — Recap screen + achievement popups          */
/*  Depends on: 01, 02, 05                                      */
/* ═══════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

CF.Screens = (() => {
  const S = CF.State;
  const L = CF.CampaignLogic;
  const A = CF.Achievements;

  /* ═══════════════════════════════════════════════════════ */
  /*  RECAP SCREEN                                            */
  /* ═══════════════════════════════════════════════════════ */
  function renderRecap(container, ctx, actions) {
    const { won, result, session, level, elapsedMs } = ctx;
    const accuracy = session.answered > 0 ? session.correct / session.answered : 0;
    const accuracyPct = Math.round(accuracy * 100);

    // Headline
    const headline = won
      ? (result?.stars === 3 ? 'FLAWLESS VICTORY' : 'VICTORY')
      : 'DEFEAT';

    const starsHtml = won
      ? '★'.repeat(result?.stars || 0) + '☆'.repeat(3 - (result?.stars || 0))
      : '';

    // Per-question log
    const logRows = (session.roundLog || []).map((entry, i) => `
      <div class="recap-row ${entry.correct ? 'ok' : 'fail'}">
        <span class="recap-num">Q${i + 1}</span>
        <span class="recap-mark">${entry.correct ? '✓' : '✗'}</span>
        <span class="recap-title">${escapeHtml(entry.title || entry.type)}</span>
        <span class="recap-type">${escapeHtml(entry.type)}</span>
        <span class="recap-time">${(entry.elapsedMs / 1000).toFixed(1)}s</span>
      </div>
    `).join('');

    // Rewards
    const rewardHtml = result && result.xpGained
      ? `
        <div class="recap-rewards">
          <div class="recap-reward">
            <div class="recap-reward-val">+${result.xpGained}</div>
            <div class="recap-reward-lbl">XP</div>
          </div>
          <div class="recap-reward">
            <div class="recap-reward-val">+${result.coinsGained || 0}</div>
            <div class="recap-reward-lbl">🪙 Coins</div>
          </div>
          ${result.newBestTime ? `<div class="recap-reward new-best">
            <div class="recap-reward-val">${L.formatTime(elapsedMs)}</div>
            <div class="recap-reward-lbl">New Best</div>
          </div>` : ''}
        </div>
      ` : '';

    container.innerHTML = `
      <div class="recap-card">
        <div class="recap-headline ${won ? 'win' : 'loss'}">${headline}</div>
        ${won ? `<div class="recap-stars">${starsHtml}</div>` : ''}
        <div class="recap-subtitle">${escapeHtml(level?.name || '')}</div>

        <div class="recap-stats">
          <div class="recap-stat">
            <div class="recap-stat-val">${session.correct} / ${session.answered}</div>
            <div class="recap-stat-lbl">Correct</div>
          </div>
          <div class="recap-stat">
            <div class="recap-stat-val">${accuracyPct}%</div>
            <div class="recap-stat-lbl">Accuracy</div>
          </div>
          <div class="recap-stat">
            <div class="recap-stat-val">${session.maxCombo}</div>
            <div class="recap-stat-lbl">Max Combo</div>
          </div>
          <div class="recap-stat">
            <div class="recap-stat-val">${L.formatTime(elapsedMs)}</div>
            <div class="recap-stat-lbl">Time</div>
          </div>
        </div>

        ${logRows ? `
          <div class="recap-section-title">Question Log</div>
          <div class="recap-log">${logRows}</div>
        ` : ''}

        ${rewardHtml}

        <div class="recap-actions">
          <button class="btn primary" id="recapMap">Return to Map</button>
          <button class="btn ghost" id="recapRetry">Retry</button>
        </div>
      </div>
    `;

    container.querySelector('#recapMap')?.addEventListener('click', actions.onMap);
    container.querySelector('#recapRetry')?.addEventListener('click', actions.onRetry);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  ACHIEVEMENT POPUP QUEUE                                 */
  /* ═══════════════════════════════════════════════════════ */
  let popupQueue = [];
  let popupActive = false;

  function showAchievements(badges) {
    if (!badges || !badges.length) return;
    popupQueue.push(...badges);
    if (!popupActive) drainQueue();
  }

  function drainQueue() {
    if (!popupQueue.length) { popupActive = false; return; }
    popupActive = true;
    const badge = popupQueue.shift();
    popupActiveFor(badge, () => {
      setTimeout(drainQueue, 300);
    });
  }

  function popupActiveFor(badge, done) {
    const el = document.createElement('div');
    el.className = 'achievement-popup rarity-' + badge.rarity;
    el.innerHTML = `
      <div class="ach-sparkle"></div>
      <div class="ach-icon">${badge.icon}</div>
      <div class="ach-text">
        <div class="ach-kicker">🏆 Achievement Unlocked</div>
        <div class="ach-name">${escapeHtml(badge.name)}</div>
        <div class="ach-desc">${escapeHtml(badge.description)}</div>
      </div>
      <div class="ach-rarity">${badge.rarity}</div>
    `;
    document.body.appendChild(el);

    // Play unlock sound
    playAchievementSound(badge.rarity);

    // Animate in
    requestAnimationFrame(() => el.classList.add('show'));

    // Animate out after delay
    setTimeout(() => {
      el.classList.remove('show');
      el.classList.add('hide');
      setTimeout(() => { el.remove(); if (done) done(); }, 500);
    }, 3200);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  SOUND                                                   */
  /* ═══════════════════════════════════════════════════════ */
  let actx = null;
  function ac() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, start, dur, type, vol) {
    const c = ac();
    const t = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur);
  }
  function playAchievementSound(rarity) {
    const vol = (S.profile.settings.sfxVolume ?? 0.7);
    if (vol === 0) return;
    if (rarity === 'platinum') {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.14 * vol));
    } else if (rarity === 'gold') {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.13 * vol));
    } else if (rarity === 'silver') {
      [440, 587, 740].forEach((f, i) => tone(f, i * 0.07, 0.4, 'triangle', 0.12 * vol));
    } else {
      [392, 523].forEach((f, i) => tone(f, i * 0.06, 0.35, 'triangle', 0.1 * vol));
    }
  }

  /* ═══ HELPERS ═══ */
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { renderRecap, showAchievements };
})();





</script>
<script>
/* ═══════════════════════════════════════════════════════════ */
/*  11-engine.js — Fight loop, combat visuals, sounds          */
/*  Depends on: 01, 02, 03, 04                                 */
/* ═══════════════════════════════════════════════════════════ */
window.CF = window.CF || {};

CF.Engine = (() => {
  const S = CF.State;
  const L = CF.CampaignLogic;
  const Q = CF.Questions;
  const R = CF.Renderers;
  const M = CF.Modes;
  const Music = CF.Music;

  /* ═══ SPEED TIERS (campaign: longer because code questions) ═══ */
  const TIERS = [
    { key: 'perfect', maxMs: 12000, label: '⚡ PERFECT!', color: '#fbbf24', dmgMult: 2.0, animMs: 1700 },
    { key: 'great',   maxMs: 22000, label: 'GREAT!',      color: '#fb923c', dmgMult: 1.5, animMs: 1100 },
    { key: 'good',    maxMs: 35000, label: 'GOOD',        color: '#22d3ee', dmgMult: 1.0, animMs: 700 },
    { key: 'slow',    maxMs: Infinity, label: 'SLOW…',    color: '#94a3b8', dmgMult: 0.7, animMs: 400 }
  ];
  function classify(ms) { return TIERS.find(t => ms < t.maxMs); }

  /* ═══ COMPACT SOUND ENGINE ═══ */
  let actx = null;
  function ac() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type, vol, sweepTo) {
    const c = ac();
    const t = c.currentTime;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(sweepTo, 1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol, freq, q) {
    const c = ac();
    const t = c.currentTime;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq || 2000; f.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
  }
  function playTier(tier) {
    const vol = S.profile.settings.sfxVolume ?? 0.7;
    if (vol === 0) return;
    if (tier === 'perfect') {
      tone(160, 0.32, 'sine', 0.5 * vol, 45);
      tone(180, 0.5, 'sawtooth', 0.2 * vol, 40);
      tone(1750, 0.4, 'square', 0.06 * vol);
      tone(2340, 0.4, 'square', 0.05 * vol);
      noise(0.22, 0.22 * vol, 3200, 1.4);
    } else if (tier === 'great') {
      tone(160, 0.3, 'sine', 0.4 * vol, 45);
      tone(1400, 0.35, 'square', 0.05 * vol);
      noise(0.14, 0.15 * vol, 2400, 1.2);
    } else if (tier === 'good') {
      tone(160, 0.25, 'sine', 0.25 * vol, 45);
      noise(0.09, 0.1 * vol, 1600, 1.1);
    } else {
      tone(160, 0.2, 'sine', 0.14 * vol, 45);
    }
  }
  function playWrong() {
    const vol = S.profile.settings.sfxVolume ?? 0.7;
    if (vol === 0) return;
    tone(220, 0.18, 'sawtooth', 0.12 * vol, 110);
    tone(180, 0.2, 'square', 0.08 * vol, 90);
  }
  function playEnemyHit() {
    const vol = S.profile.settings.sfxVolume ?? 0.7;
    if (vol === 0) return;
    tone(160, 0.32, 'sine', 0.35 * vol, 45);
    noise(0.1, 0.15 * vol, 1200, 1);
    tone(120, 0.25, 'sawtooth', 0.1 * vol, 60);
  }
  function playWin() {
    const vol = S.profile.settings.sfxVolume ?? 0.7;
    if (vol === 0) return;
    [660, 880, 1320, 1760].forEach((f, i) => tone(f, 0.4, 'triangle', 0.14 * vol));
  }
  function playLose() {
    const vol = S.profile.settings.sfxVolume ?? 0.7;
    if (vol === 0) return;
    tone(300, 0.3, 'sawtooth', 0.14 * vol);
    tone(180, 0.5, 'sawtooth', 0.14 * vol);
  }
  function playWhoosh() {
    const vol = S.profile.settings.sfxVolume ?? 0.7;
    if (vol === 0) return;
    noise(0.16, 0.12 * vol, 500, 0.8);
  }

  /* ═══ DOM REFS ═══ */
  let arenaEl, playerSprite, enemySprite, playerHealthEl, enemyHealthEl;
  let timerEl, questionWrap, feedbackEl, tierTimerEl, questionCounterEl;

  function cacheDom() {
    arenaEl          = document.getElementById('fightArena');
    playerSprite     = document.getElementById('fightPlayer');
    enemySprite      = document.getElementById('fightEnemy');
    playerHealthEl   = document.getElementById('fightPlayerHealth');
    enemyHealthEl    = document.getElementById('fightEnemyHealth');
    timerEl          = document.getElementById('fightTimer');
    questionWrap     = document.getElementById('questionWrap');
    feedbackEl       = document.getElementById('fightFeedback');
    tierTimerEl      = document.getElementById('tierTimer');
    questionCounterEl= document.getElementById('questionCounter');
  }

  /* ═══ FIGHT STATE ═══ */
  let queue = [];
  let qIndex = 0;
  let qStart = 0;
  let tierTimerInterval = null;
  let sessionTimeID = null;
  let onExit = null;
  let currentQ = null;
  let currentAnswerHandler = null;
  let hintUsedThisQ = false;

  // Mode / archetype runtime
  let config = null;             // full fight config
  let blitzTimerPerQ = null;     // ms per question (null = elapsed)
  let blitzTimeoutID = null;
  let blitzDeadline = 0;
  let bossState = {
    shield: true,                // p1 boss
    consecutiveCorrect: 0,       // guard boss
    round: 0,                    // p6 boss
    currentTimerMs: null,        // shrinking timer bosses
    lockedChoice: null           // x8 boss
  };

  /* ═══════════════════════════════════════════════════════ */
  /*  START A FIGHT                                           */
  /* ═══════════════════════════════════════════════════════ */
  function start(levelOrConfig, exitCallback) {
    onExit = exitCallback;
    cacheDom();

    // Accept either a raw level (from campaign map) or a pre-configured fight.
    // If it has `archetype`, it's already configured.
    if (levelOrConfig.archetype) {
      config = levelOrConfig;
    } else {
      config = M.configureLevel(levelOrConfig);
    }

    // Pick questions
    if (config.preSelected && config.preSelected.length) {
      // Review run — use the pre-selected due questions directly
      queue = [...config.preSelected];
    } else if (config.unlockedPatterns && config.unlockedPatterns.length) {
      // Blitz: mix patterns
      const pool = Q.BANK.filter(q =>
        config.unlockedPatterns.includes(q.pattern) &&
        q.difficulty <= config.diff
      );
      queue = Q.shuffle(pool).slice(0, config.questions);
    } else {
      // Campaign — blend due-for-review with fresh
      queue = CF.Spaced.pickWithReview(config);
    }
    qIndex = 0;

    // Reset session
    const maxHP = 100 + (S.profile.upgrades.maxHP || 0) * 20;
    S.resetSession({
      mode: config.tier === 'blitz' ? 'blitz' : 'campaign',
      campaignLevel: config.tier === 'blitz' ? null : config.id,
      enemyArchetype: config.enemy,
      questionsRemaining: queue.length,
      playerHP: maxHP,
      enemyHP: config.enemyHP,
      enemyMaxHP: config.enemyMaxHP
    });
    S.session.enemyDamageBase = config.enemyDamage;

        // Reset per-fight flags
    S.session.shieldUsed = false;

    // Reset boss state
    bossState = {
      shield: true,
      consecutiveCorrect: 0,
      round: 0,
      currentTimerMs: config.timerPerQuestion,
      lockedChoice: null
    };

    applyArchetype(config.enemy);
    updateHUD();
    timerEl.textContent = config.tier === 'blitz' ? '10.0' : '0:00';
    startSessionTimer();

    // Entry fanfare (short) then loop the battle theme
    playEntryFanfare(config.enemy);
    setTimeout(() => {
      if (config.tier === 'blitz') Music.play('blitz');
      else if (config.tier === 'boss') Music.play('boss');
      else Music.play('combat');
    }, 900);

    nextQuestion();
  }

  function applyArchetype(enemy) {
    const arch = M.getArchetype(enemy);
    enemySprite.textContent = arch.icon;
    enemySprite.dataset.archetype = enemy;
  }

  /* ═══ SESSION TIMER (elapsed, not countdown) ═══ */
  function startSessionTimer() {
    const start = performance.now();
    clearInterval(sessionTimeID);
    sessionTimeID = setInterval(() => {
      const ms = performance.now() - start;
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      timerEl.textContent = `${m}:${String(s % 60).padStart(2, '0')}`;
      timerEl.dataset.start = start;
    }, 500);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  NEXT QUESTION                                          */
  /* ═══════════════════════════════════════════════════════ */
  function nextQuestion() {
    if (S.session.playerHP <= 0 || S.session.enemyHP <= 0 || qIndex >= queue.length) {
      endFight();
      return;
    }

    // p6 Boss: cannot end before minRounds
    if (config.bossMech?.rule === 'min_rounds') {
      if (qIndex < config.bossMech.minRounds && S.session.enemyHP <= 0) {
        S.session.enemyHP = 1;   // hold at 1 HP until minimum rounds passed
        updateHUD();
      }
    }

    bossState.round++;
    hintUsedThisQ = false;

    let q = queue[qIndex];
    currentQ = q;
    S.session.questionStartTime = performance.now();
    qStart = performance.now();

    // p4 / x2 Boss: shrink timer
    if (config.bossMech?.rule === 'shrinking_timer') {
      if (bossState.currentTimerMs == null) {
        bossState.currentTimerMs = config.bossMech.startTimer * 1000;
      } else if (bossState.round > 1) {
        bossState.currentTimerMs = Math.max(4000,
          bossState.currentTimerMs - config.bossMech.decrement * 1000);
      }
    } else {
      bossState.currentTimerMs = config.timerPerQuestion;
    }

    questionCounterEl.textContent = `Q${qIndex + 1} / ${queue.length}`;
    feedbackEl.textContent = '';
    feedbackEl.className = 'fight-feedback';

    // Show boss mechanic banner on the first question
    if (config.bossMech && qIndex === 0) {
      feedbackEl.className = 'fight-feedback boss-intro';
      feedbackEl.textContent = `${config.bossMech.icon} ${config.bossMech.name} — ${config.bossMech.desc}`;
    }

    currentAnswerHandler = (submitted) => {
      const elapsed = performance.now() - qStart;
      handleAnswer(q, submitted, elapsed);
    };
    R.mount(q, questionWrap, currentAnswerHandler);

    // Archetype restrictions applied post-mount
    applyArchetypeToQuestion(q);

    startTierTimer();
  }

  function applyArchetypeToQuestion(q) {
    const arch = config.archetype;
    if (!arch) return;

    // Sorcerer: disable one wrong option
    if (arch.restrictions.includes('curse-one') && q.options && q.type !== 'order' && q.type !== 'numeric') {
      const options = questionWrap.querySelectorAll('.mcq-option, .chip');
      const wrongIdxs = [];
      options.forEach((el, i) => { if (i !== q.correct) wrongIdxs.push(i); });
      if (wrongIdxs.length) {
        const cursedIdx = wrongIdxs[Math.floor(Math.random() * wrongIdxs.length)];
        options[cursedIdx].disabled = true;
        options[cursedIdx].style.opacity = '.35';
        options[cursedIdx].style.textDecoration = 'line-through';
      }
    }

    // x8 Boss: locked button carry-over
    if (config.bossMech?.rule === 'lock_button' && bossState.lockedChoice != null) {
      const options = questionWrap.querySelectorAll('.mcq-option, .chip');
      const el = options[bossState.lockedChoice];
      if (el) {
        el.disabled = true;
        el.style.opacity = '.35';
        el.style.textDecoration = 'line-through';
      }
    }
  }

  /* ═══ TIER TIMER — elapsed (campaign) OR countdown (blitz/boss) ═══ */
  function startTierTimer() {
    clearInterval(tierTimerInterval);
    clearTimeout(blitzTimeoutID);

    const timeoutMs = bossState.currentTimerMs;

    if (timeoutMs) {
      // Countdown mode
      blitzDeadline = performance.now() + timeoutMs;
      tierTimerInterval = setInterval(() => {
        const remaining = blitzDeadline - performance.now();
        if (remaining <= 0) {
          clearInterval(tierTimerInterval);
          handleTimeout();
          return;
        }
        tierTimerEl.textContent = (remaining / 1000).toFixed(1) + 's';
        const frac = remaining / timeoutMs;
        if (frac < 0.15) tierTimerEl.dataset.tier = 'slow';
        else if (frac < 0.35) tierTimerEl.dataset.tier = 'good';
        else if (frac < 0.65) tierTimerEl.dataset.tier = 'great';
        else tierTimerEl.dataset.tier = 'perfect';
      }, 80);
    } else {
      // Elapsed mode
      tierTimerInterval = setInterval(() => {
        const ms = performance.now() - qStart;
        tierTimerEl.textContent = (ms / 1000).toFixed(1) + 's';
        tierTimerEl.dataset.tier = classify(ms).key;
      }, 100);
    }
  }

  function stopTierTimer() {
    clearInterval(tierTimerInterval);
    clearTimeout(blitzTimeoutID);
  }

  function handleTimeout() {
    // Countdown hit 0 — treat as wrong answer
    stopTierTimer();
    feedbackEl.className = 'fight-feedback wrong';
    feedbackEl.textContent = '⏰ TIME OUT! The enemy strikes first.';
    playWrong();

    S.session.roundLog.push({
      id: currentQ?.id || 'timeout',
      pattern: currentQ?.pattern,
      type: currentQ?.type,
      title: currentQ?.title || 'Timeout',
      correct: false,
      elapsedMs: bossState.currentTimerMs || 10000,
      timedOut: true
    });
    S.session.answered++;
    S.session.combo = 0;

    setTimeout(() => {
      const dmg = (S.session.enemyDamageBase || 15) * 1.5;   // timeout hurts
      playEnemyHit();
      cinematicEnemyAttack(Math.round(dmg));
      setTimeout(() => { qIndex++; nextQuestion(); }, 1400);
    }, 400);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  HANDLE ANSWER                                          */
  /* ═══════════════════════════════════════════════════════ */
  function handleAnswer(q, submitted, elapsedMs) {
    stopTierTimer();
    const correct = R.checkAnswer(q, submitted);
    S.session.answered++;

    const arch = config.archetype;
    const mech = config.bossMech;

    // Record for spaced repetition
    try { CF.Spaced.recordAnswer(q, correct, hintUsedThisQ); } catch (e) { /* no-op */ }

    // Log for recap
    S.session.roundLog.push({
      id: q.id,
      pattern: q.pattern,
      type: q.type,
      title: q.title,
      correct,
      elapsedMs
    });

    if (correct) {
      S.session.correct++;
      S.session.combo++;
      if (S.session.combo > S.session.maxCombo) S.session.maxCombo = S.session.combo;
      bossState.consecutiveCorrect++;

      const tier = classify(elapsedMs);
      if (tier.key === 'perfect') S.session.perfectAnswers++;

      /* ─── Compute damage ─── */
      const baseDmg = Q.getTypeMeta(q.type).baseDamage
                    + (S.profile.upgrades.baseDamage || 0) * 5;
      let dmg = Math.round(baseDmg * tier.dmgMult);

      let dmgNote = '';

      // Ghost archetype: MCQ-type questions deal 0
      if (arch.restrictions.includes('no-mcq') && isMCQType(q.type)) {
        dmg = 0;
        dmgNote = ' · 👻 Ghost absorbs MCQ damage!';
      }

      // p1 Boss: only pattern questions break the shield
      if (mech?.rule === 'shield_pattern_only' && bossState.shield) {
        if (q.type !== 'pattern') {
          dmg = 0;
          dmgNote = ' · 🦂 Shield absorbs non-recognition hits!';
        } else {
          bossState.shield = false;
          dmgNote = ' · 💥 Shield broken!';
        }
      }

      // Guard boss: needs 2 correct in a row
      if (mech?.rule === 'streak_2') {
        if (bossState.consecutiveCorrect < 2) {
          dmg = 0;
          dmgNote = ` · 🔒 Gate needs ${2 - bossState.consecutiveCorrect} more in a row`;
        } else {
          bossState.consecutiveCorrect = 0;
        }
      }

      // p6 Boss: cannot die before minRounds
      if (mech?.rule === 'min_rounds' && qIndex + 1 < mech.minRounds) {
        if (S.session.enemyHP - dmg <= 0) {
          dmg = Math.max(0, S.session.enemyHP - 1);
          dmgNote = ' · 🗿 Keeper withstands fatal damage!';
        }
      }

      feedbackEl.className = 'fight-feedback correct';
      feedbackEl.textContent = `${tier.label} · ${dmg} damage${dmgNote} · ${q.explanation || ''}`;

      playWhoosh();
      setTimeout(() => playTier(tier.key), 200);
      cinematicHit(tier, dmg);

      setTimeout(() => {
        qIndex++;
        nextQuestion();
      }, tier.animMs + 400);
    } else {
      // Combo shield: absorb the first wrong answer
      if (S.profile.upgrades.comboShield && !S.session.shieldUsed) {
        S.session.shieldUsed = true;
        feedbackEl.className = 'fight-feedback hint';
        feedbackEl.textContent = '🛡️ Shield absorbed — combo preserved.';
        setTimeout(() => {
          qIndex++;
          nextQuestion();
        }, 900);
        return;
      }

      S.session.combo = 0;
      bossState.consecutiveCorrect = 0;
      const correctText = R.formatCorrect(q);

      feedbackEl.className = 'fight-feedback wrong';
      feedbackEl.textContent = `✗ Correct: ${correctText} · ${q.explanation || ''}`;

      playWrong();

      setTimeout(() => {
        let dmg = S.session.enemyDamageBase || 15;

        // p7 Boss: triple damage on wrong
        if (mech?.rule === 'triple_wrong_damage') dmg *= 3;

        // p2 Boss: heal on wrong
        if (mech?.rule === 'heal_on_wrong') {
          S.session.enemyHP = Math.min(S.session.enemyMaxHP, S.session.enemyHP + mech.heal);
          updateHUD();
          feedbackEl.textContent += ` · 🐙 Boss heals ${mech.heal} HP`;
        }

        // x8 Boss: lock one choice for next question
        if (mech?.rule === 'lock_button' && q.options) {
          const idxs = q.options.map((_, i) => i).filter(i => i !== q.correct);
          bossState.lockedChoice = idxs[Math.floor(Math.random() * idxs.length)];
        }

        playEnemyHit();
        cinematicEnemyAttack(Math.round(dmg));
        setTimeout(() => {
          qIndex++;
          nextQuestion();
        }, 1500);
      }, 500);
    }
  }

  function isMCQType(type) {
    return ['pattern', 'complexity', 'state', 'trace', 'invariant', 'bug', 'nextline'].includes(type);
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  COMBAT VISUALS                                          */
  /* ═══════════════════════════════════════════════════════ */
  function cinematicHit(tier, damage) {
    const isPerfect = tier.key === 'perfect';

    arenaEl.style.setProperty('--shake-int', isPerfect ? '24px' : tier.key === 'great' ? '14px' : '6px');
    arenaEl.classList.remove('shake'); void arenaEl.offsetWidth;
    arenaEl.classList.add('shake', 'hitstop');

    playerSprite.classList.remove('lunge', 'tier-perfect', 'tier-great', 'tier-good', 'tier-slow');
    void playerSprite.offsetWidth;
    playerSprite.classList.add('lunge', 'tier-' + tier.key);

    setTimeout(() => {
      spawnFlash(tier.key);
      spawnShockwaves(tier.key);
      spawnSparks(isPerfect ? 32 : tier.key === 'great' ? 20 : 10, tier);
      if (isPerfect) spawnLightning();

      enemySprite.classList.add('hit');
      setTimeout(() => enemySprite.classList.remove('hit'), 500);
      spawnTierLabel(tier);
      spawnDamagePopup(enemySprite, damage, tier.key);

      // Combo explosion at high combos on perfect
      if (isPerfect && S.session.combo >= 3) {
        spawnComboExplode(`🔥 ${S.session.combo}× COMBO`);
      }

      S.session.enemyHP = Math.max(0, S.session.enemyHP - damage);
      updateHUD();

      setTimeout(() => {
        arenaEl.classList.remove('hitstop', 'shake');
        playerSprite.classList.remove('tier-' + tier.key);
      }, tier.animMs);
    }, isPerfect ? 300 : 220);
  }

  /* ═══ SHOCKWAVES ═══ */
  function spawnShockwaves(tier) {
    const count = tier === 'perfect' ? 3 : tier === 'great' ? 2 : 1;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'shockwave ' + tier;
      if (i > 0) el.classList.add('delay-' + i);
      arenaEl.appendChild(el);
      setTimeout(() => el.remove(), 1600 + i * 200);
    }
  }

  /* ═══ LIGHTNING BOLTS (perfect only) ═══ */
  function spawnLightning() {
    const w = arenaEl.clientWidth, h = arenaEl.clientHeight;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'lightning');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    const cx = w / 2, cy = h / 2;
    for (let b = 0; b < 5; b++) {
      const angle = (Math.PI * 2 * b) / 5 + Math.random() * 0.4;
      let d = `M ${cx} ${cy}`;
      const segments = 6;
      for (let i = 1; i <= segments; i++) {
        const r = (i / segments) * 180;
        const jitter = (Math.random() - 0.5) * 40;
        const x = cx + Math.cos(angle) * r + jitter;
        const y = cy + Math.sin(angle) * r + jitter;
        d += ` L ${x} ${y}`;
      }
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d);
      svg.appendChild(p);
    }
    arenaEl.appendChild(svg);
    setTimeout(() => svg.remove(), 1600);
  }

  /* ═══ COMBO EXPLOSION ═══ */
  function spawnComboExplode(text) {
    const el = document.createElement('div');
    el.className = 'combo-explode';
    el.textContent = text;
    arenaEl.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  function cinematicEnemyAttack(damage) {
    enemySprite.classList.remove('attacking'); void enemySprite.offsetWidth;
    enemySprite.classList.add('attacking');

    arenaEl.classList.remove('shake'); void arenaEl.offsetWidth;
    arenaEl.classList.add('shake');
    arenaEl.style.setProperty('--shake-int', '10px');

    setTimeout(() => {
      spawnFlash('slow');
      spawnSparks(10, { key: 'slow', color: '#f43f5e' });
      playerSprite.classList.add('hit');
      spawnDamagePopup(playerSprite, damage, 'good');
      S.session.playerHP = Math.max(0, S.session.playerHP - damage);
      updateHUD();

      setTimeout(() => {
        playerSprite.classList.remove('hit');
        arenaEl.classList.remove('shake');
      }, 600);
    }, 220);
  }

  function spawnFlash(tier) {
    const el = document.createElement('div');
    el.className = 'flash-overlay ' +
      (tier === 'perfect' ? 'gold' : tier === 'great' ? 'orange' : 'cyan');
    arenaEl.appendChild(el);
    setTimeout(() => el.remove(), 500);
  }

  function spawnSparks(count, tier) {
    const colors = tier.key === 'perfect' ? ['#fbbf24','#fde68a','#fff','#fb923c']
                 : tier.key === 'great'   ? ['#fb923c','#fdba74','#fff']
                 : tier.key === 'slow'    ? ['#64748b','#94a3b8']
                 : ['#22d3ee','#67e8f9','#fff'];
    const rect = arenaEl.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'spark';
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 * (0.5 + Math.random() * 0.8);
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      const color = colors[Math.floor(Math.random() * colors.length)];
      el.style.background = color;
      el.style.boxShadow = `0 0 12px ${color}, 0 0 24px ${color}`;
      el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--ty', Math.sin(angle) * dist - 30 + 'px');
      el.style.setProperty('--dur', (0.7 + Math.random() * 0.5) + 's');
      arenaEl.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }
  }

  function spawnTierLabel(tier) {
    const el = document.createElement('div');
    el.className = 'tier-label';
    el.textContent = tier.label;
    el.style.color = tier.color;
    el.style.textShadow = `0 0 30px ${tier.color}, 0 0 60px ${tier.color}, 0 4px 8px rgba(0,0,0,.9)`;
    arenaEl.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }

  function spawnDamagePopup(target, dmg, tier) {
    const rect = target.getBoundingClientRect();
    const ar = arenaEl.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'damage-popup tier-' + tier;
    el.textContent = '−' + dmg;
    el.style.left = (rect.left - ar.left + rect.width / 2) + 'px';
    el.style.top  = (rect.top - ar.top + 20) + 'px';
    arenaEl.appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }

  function updateHUD() {
    const playerMax = 100 + (S.profile.upgrades.maxHP || 0) * 20;
    const pPct = Math.max(0, (S.session.playerHP / playerMax) * 100);
    const ePct = Math.max(0, (S.session.enemyHP / S.session.enemyMaxHP) * 100);
    playerHealthEl.style.width = pPct + '%';
    enemyHealthEl.style.width  = ePct + '%';
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  END FIGHT                                               */
  /* ═══════════════════════════════════════════════════════ */
  function endFight() {
    stopTierTimer();
    clearInterval(sessionTimeID);
    Music.stop();

    const won = S.session.enemyHP <= 0 || (S.session.playerHP > 0 && qIndex >= queue.length);
    const elapsed = performance.now() - Number(timerEl.dataset.start || performance.now());

    if (won) playWin(); else playLose();

    // Complete the campaign level (awards XP, coins, stars)
    if (S.session.campaignLevel) {
      const result = L.completeFight(S.session.campaignLevel, won, S.session, elapsed);
      S.checkAndUpdateStreak();
      if (onExit) onExit({ won, result, session: S.session });
    } else {
      if (onExit) onExit({ won, result: null, session: S.session });
    }
  }
  /* ═══════════════════════════════════════════════════════ */
  /*  HINT + SKIP                                             */
  /* ═══════════════════════════════════════════════════════ */
  function applyHint() {
    if (!currentQ || hintUsedThisQ) return false;
    hintUsedThisQ = true;
    S.session.hintsUsed = (S.session.hintsUsed || 0) + 1;

    // Free hint from shop
    if (S.profile.upgrades.freeHints > 0) {
      S.profile.upgrades.freeHints--;
      S.save();
      feedbackEl.className = 'fight-feedback hint';
      feedbackEl.textContent = '💡 (Free hint) ' + (currentQ.hint || currentQ.explanation || '');
      return true;
    }

    S.session.playerHP = Math.max(0, S.session.playerHP - 5);

    // x5 Boss: heals on hint
    if (config?.bossMech?.rule === 'heal_on_hint') {
      S.session.enemyHP = Math.min(S.session.enemyMaxHP,
        S.session.enemyHP + config.bossMech.heal);
    }

    updateHUD();
    feedbackEl.className = 'fight-feedback hint';
    feedbackEl.textContent = '💡 ' + (currentQ.hint || currentQ.explanation || 'No hint available.');
    if (S.session.playerHP <= 0) setTimeout(endFight, 400);
    return true;
  }

  function applySkip() {
    if (!currentQ) return false;
    stopTierTimer();
    S.session.hintsUsed = (S.session.hintsUsed || 0) + 1;
    S.session.playerHP = Math.max(0, S.session.playerHP - 10);
    S.session.combo = 0;
    updateHUD();

    const correctText = R.formatCorrect(currentQ);
    S.session.roundLog.push({
      id: currentQ.id,
      pattern: currentQ.pattern,
      type: currentQ.type,
      title: currentQ.title,
      correct: false,
      elapsedMs: performance.now() - qStart,
      skipped: true
    });
    S.session.answered++;

    feedbackEl.className = 'fight-feedback info';
    feedbackEl.textContent = `⏭ Skipped. Correct: ${correctText}`;

    if (S.session.playerHP <= 0) { setTimeout(endFight, 800); return true; }

    setTimeout(() => { qIndex++; nextQuestion(); }, 1500);
    return true;
  }
  /* ═══ REROLL ═══ */
  function applyReroll() {
    if (!currentQ) return false;
    if ((S.profile.upgrades.rerolls || 0) <= 0) return false;
    S.profile.upgrades.rerolls--;
    S.save();

    // Pick a different question from the same pattern, not already in queue
    const usedIds = new Set(queue.map(q => q.id));
    const pool = Q.BANK.filter(q =>
      q.pattern === currentQ.pattern &&
      !usedIds.has(q.id) &&
      q.difficulty <= (config.diff || 3)
    );
    if (!pool.length) return false;

    const newQ = pool[Math.floor(Math.random() * pool.length)];
    queue[qIndex] = newQ;

    // Re-render
    stopTierTimer();
    nextQuestion();
    return true;
  }

  /* ═══ CLEANUP ═══ */
  function abort() {
    stopTierTimer();
    clearInterval(sessionTimeID);
    Music.stop();
    currentQ = null;
    currentAnswerHandler = null;
  }
    /* ═══ CLEANUP ═══ */
  function abort() {
    stopTierTimer();
    clearInterval(sessionTimeID);
    Music.stop();
    currentQ = null;
    currentAnswerHandler = null;
  }

  /* ═══════════════════════════════════════════════════════ */
  /*  ENTRY FANFARE — short theme when a fight begins        */
  /* ═══════════════════════════════════════════════════════ */
  let actx2 = null;
  function ac2() {
    if (!actx2) actx2 = new (window.AudioContext || window.webkitAudioContext)();
    if (actx2.state === 'suspended') actx2.resume();
    return actx2;
  }

  function fanfareTone(freq, start, dur, type, vol) {
    const c = ac2();
    const t = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur);
  }

  function playEntryFanfare(enemy) {
    const vol = (S.profile.settings.sfxVolume ?? 0.7) * 0.6;
    if (vol === 0) return;
    const patterns = {
      bot:       [[523,0,0.12],[659,0.1,0.12],[784,0.2,0.25]],
      ghost:     [[440,0,0.15],[392,0.15,0.15],[330,0.3,0.4]],
      tank:      [[196,0,0.2],[196,0.2,0.2],[147,0.4,0.5]],
      berserker: [[330,0,0.08],[440,0.08,0.08],[660,0.16,0.08],[880,0.24,0.3]],
      sorcerer:  [[659,0,0.1],[784,0.1,0.1],[1047,0.2,0.1],[784,0.3,0.4]],
      boss:      [[110,0,0.4],[139,0.3,0.4],[165,0.6,0.6]]
    };
    const notes = patterns[enemy] || patterns.bot;
    notes.forEach(([f, s, d]) => fanfareTone(f, s, d, 'triangle', vol));
  }

  return { start, abort, applyHint, applySkip, applyReroll };
})();

          <div class="stat-cell"><div class="stat-cell-val">${stats.mastered}</div><div class="stat-cell-lbl">Mastered</div></div>
          <div class="stat-cell"><div class="stat-cell-val">${stats.due}</div><div class="stat-cell-lbl">Due Review</div></div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-title">💾 Profile</div>
        <button class="settings-action" id="exportProfile">📤 Export Profile (JSON)</button>
        <button class="settings-action" id="importProfile">📥 Import Profile</button>
        <button class="settings-action danger" id="resetAll">⚠️ Reset All Progress</button>
      </div>
    `;

    container.querySelector('#settingsBack').addEventListener('click', onBack);

    // Volume sliders
    const musicVol = container.querySelector('#musicVol');
    const musicVal = container.querySelector('#musicVolVal');
    musicVol.addEventListener('input', () => {
      const v = musicVol.value / 100;
      musicVal.textContent = Math.round(v * 100) + '%';
      S.profile.settings.musicVolume = v;
      CF.Music.setVolume(v);
    });

    const sfxVol = container.querySelector('#sfxVol');
    const sfxVal = container.querySelector('#sfxVolVal');
    sfxVol.addEventListener('input', () => {
      const v = sfxVol.value / 100;
      sfxVal.textContent = Math.round(v * 100) + '%';
      S.profile.settings.sfxVolume = v;
      S.save();
    });

    // Export
    container.querySelector('#exportProfile').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(S.profile, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `code-fighter-profile-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Import
    container.querySelector('#importProfile').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!data || typeof data !== 'object') throw new Error('Invalid format');
            Object.assign(S.profile, data);
            S.save();
            alert('✓ Profile imported. Reloading…');
            location.reload();
          } catch (e) {
            alert('Failed to import: ' + e.message);
          }
        };
        reader.readAsText(file);
      });
      input.click();
    });

    // Reset
    container.querySelector('#resetAll').addEventListener('click', () => {
      if (!confirm('Reset ALL progress? This cannot be undone.')) return;
      if (!confirm('Really sure? Everything will be wiped.')) return;
      S.resetProfile();
      CF.Spaced.resetAll();
      alert('Progress reset.');
      location.reload();
    });
  }

  return { render };
})();
